<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  @font-face{font-family:'Space Grotesk';src:url('./fonts/SpaceGrotesk-Bold.woff2') format('woff2');font-weight:700}
  @font-face{font-family:'JetBrains Mono';src:url('./fonts/JetBrainsMono-Regular.woff2') format('woff2');font-weight:400}

  body{width:1200px;height:630px;background:#0b0d10;color:#eef2f6;font-family:'Inter',sans-serif;position:relative;overflow:hidden}

  .role{font-size:34px;color:#a3adb8;font-weight:500;margin-bottom:44px}
  .tags{font-family:'JetBrains Mono',monospace;font-size:24px;color:#7e8c99}

  svg{position:absolute;top:64px;right:72px;opacity:.9}
</style>
</head>
<body>
  <svg width="230" height="230" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
    <circle cx="10" cy="10" r="2.4" fill="#72e0a0"/>

  </svg>
  <div class="card">

    <p class="role">Infrastructure &amp; Network Architect · ex-Google · Helsinki</p>
    <p class="tags"><span>VXLAN-EVPN</span> · <span>BGP/MPLS</span> · <span>DWDM</span> · <span>SASE</span> · <span>Ansible</span></p>
