<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V-OS Network Terminal v2.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070b0d;
      --bg-2: #0b1114;
      --surface: rgba(15, 21, 24, 0.88);
      --surface-solid: #111518;
      --surface-2: rgba(23, 31, 35, 0.92);
      --border: #203136;
      --border-soft: rgba(141, 205, 184, 0.12);
      --green: #00ff88;
      --yellow: #f0c040;
      --red: #ff4455;
      --text: #d4e1da;
      --dim: #708089;
      --dim-2: #4f5d65;
      --white-soft: rgba(255,255,255,0.06);
      --font-mono: 'Share Tech Mono', monospace;
      --font-display: 'Orbitron', sans-serif;
      --shadow-lg:
        0 20px 60px rgba(0,0,0,0.42),
        0 6px 18px rgba(0,0,0,0.24);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      color-scheme: dark;
    }

    body {
      background:
        radial-gradient(circle at top, rgba(0,255,136,0.05), transparent 28%),
        radial-gradient(circle at 80% 20%, rgba(240,192,64,0.035), transparent 22%),
        linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 100%);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 17px;
      line-height: 1.72;
      overflow-x: hidden;
      min-height: 100vh;
      padding: 20px 18px;
      display: grid;
      place-items: center;
      cursor: text;
    }

    #topology-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.14;
      pointer-events: none;
      filter: saturate(0.95);
    }

    .terminal-box {
      position: relative;
      z-index: 10;
      width: min(1280px, calc(100vw - 36px));
      height: min(88vh, 920px);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(20, 26, 30, 0.88), rgba(14, 19, 22, 0.93));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
    }

    .terminal-box::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.04),
        inset 0 0 0 1px rgba(255,255,255,0.015);
    }

    .terminal-bar {
      background:
        linear-gradient(180deg, rgba(32, 40, 45, 0.95), rgba(25, 31, 35, 0.95));
      padding: 0.9rem 1.15rem;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      position: relative;
      flex: 0 0 auto;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      display: inline-block;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.18);
      opacity: 0.95;
    }

    .dot.red { background: var(--red); }
    .dot.yellow { background: var(--yellow); }
    .dot.green { background: var(--green); }

    .terminal-title {
      margin-left: auto;
      font-size: 0.78rem;
      color: var(--dim);
      font-family: var(--font-display);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .terminal-body {
      position: relative;
      padding: 1.2rem 1.5rem 0;
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
    }

    #terminal {
      padding-bottom: 0.5rem;
    }
    
    #boot-output {
      white-space: pre-wrap;
      word-break: normal;
      overflow-wrap: break-word;
      line-height: 1.45;
    }
    
    .output {
      margin-bottom: 0.9rem;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      line-height: 1.58;
      color: var(--text);
      animation: outputFade 150ms ease-out;
    }

    @keyframes outputFade {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .interactive-node {
      color: var(--yellow);
      cursor: pointer;
      text-decoration: none;
      font-weight: bold;
      transition: color 160ms ease, text-shadow 160ms ease, opacity 160ms ease;
    }

    .interactive-node:hover {
      color: #fff7d6;
      text-shadow: 0 0 10px rgba(240,192,64,0.35);
      text-decoration: underline;
    }

    .prompt {
      color: var(--green);
      font-weight: bold;
    }

    .user-input {
      color: var(--yellow);
    }

    .input-line {
      position: sticky;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: 0.28rem;
      margin-top: 0.2rem;
      padding: 0.45rem 0 0.55rem;
      background:
        linear-gradient(180deg, rgba(17,21,24,0) 0%, rgba(17,21,24,0.78) 32%, rgba(17,21,24,0.97) 100%);
      border-top: 1px solid rgba(255,255,255,0.04);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    input {
      background: transparent;
      border: none;
      color: var(--yellow);
      font-family: inherit;
      font-size: inherit;
      width: 100%;
      outline: none;
      caret-color: var(--green);
      padding-top: 1px;
    }

    input::placeholder {
      color: var(--dim-2);
    }

    a {
      color: var(--green);
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
    }

    .terminal-body::-webkit-scrollbar {
      width: 10px;
    }

    .terminal-body::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.02);
      border-left: 1px solid rgba(255,255,255,0.03);
    }

    .terminal-body::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, rgba(92, 119, 128, 0.55), rgba(67, 88, 95, 0.7));
      border-radius: 999px;
      border: 2px solid rgba(0,0,0,0);
      background-clip: padding-box;
    }

    .terminal-body::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, rgba(120, 152, 163, 0.7), rgba(80, 104, 112, 0.8));
      background-clip: padding-box;
    }

    ::selection {
      background: rgba(0,255,136,0.22);
      color: var(--text);
    }

    @media screen and (max-width: 768px) {
      body {
        padding: 10px;
        font-size: 14px;
      }
    
      .terminal-box {
        width: 100%;
        height: calc(100vh - 20px);
        border-radius: 10px;
      }
    
      .terminal-bar {
        padding: 0.75rem 0.85rem;
      }
    
      .terminal-title {
        font-size: 0.66rem;
        letter-spacing: 0.06em;
      }
    
      .terminal-body {
        padding: 0.9rem 1rem 0;
      }
    
      .input-line {
        padding: 0.38rem 0 0.48rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .output,
      .interactive-node,
      .dot {
        animation: none !important;
        transition: none !important;
      }
      #topology-bg {
        opacity: 0.08;
      }
    }
  </style>
</head>

    function levenshtein(a, b) {
      const matrix = Array.from({ length: b.length + 1 }, (_, i) => [i]);
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i - 1) === a.charAt(j - 1)) {
            matrix[i][j] = matrix[i - 1][j - 1];
          } else {
            matrix[i][j] = Math.min(
              matrix[i - 1][j - 1] + 1,
              matrix[i][j - 1] + 1,
              matrix[i - 1][j] + 1
            );
          }
        }
      }
      return matrix[b.length][a.length];
    }

    function getClosestCommand(input, commandList) {
      let bestMatch = null;
      let bestScore = Infinity;

      for (const command of commandList) {
        const score = levenshtein(input, command);
        if (score < bestScore) {
          bestScore = score;
          bestMatch = command;
        }
      }

      return { bestMatch, bestScore };

    const canvas = document.getElementById('topology-bg');
    const ctx = canvas.getContext('2d');

    let nodes = [];
    let packets = [];
    const NODE_COUNT = 24;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function initNodes() {
      nodes = [];
      packets = [];
      for (let i = 0; i < NODE_COUNT; i++) {
        nodes.push({
          id: i,
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.1,
          vy: (Math.random() - 0.5) * 0.1,
          r: Math.random() * 2 + 3,
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const rootStyles = getComputedStyle(document.documentElement);
      const hexGreen = rootStyles.getPropertyValue('--green').trim() || '#00ff88';
      const hexYellow = rootStyles.getPropertyValue('--yellow').trim() || '#f0c040';
      const hexRed = rootStyles.getPropertyValue('--red').trim() || '#ff4455';
      const hexBg = rootStyles.getPropertyValue('--bg').trim() || '#070b0d';

      const hexToRgb = (hex) => {
        let c;
        if (/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)) {
          c = hex.substring(1).split('');
          if (c.length === 3) {
            c = [c[0], c[0], c[1], c[1], c[2], c[2]];
          }
          c = '0x' + c.join('');
          return [(c >> 16) & 255, (c >> 8) & 255, c & 255];
        }
        return [0, 255, 136];
      };

      const rgbGreen = hexToRgb(hexGreen);

      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const dx = nodes[i].x - nodes[j].x;
          const dy = nodes[i].y - nodes[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist > 260) continue;

          let alpha = 0.18 - (dist / 2200);
          if (alpha < 0.03) alpha = 0.03;

          ctx.strokeStyle = `rgba(${rgbGreen[0]}, ${rgbGreen[1]}, ${rgbGreen[2]}, ${alpha})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(nodes[i].x, nodes[i].y);
          ctx.lineTo(nodes[j].x, nodes[j].y);
          ctx.stroke();
        }
      }

      if (Math.random() < 0.012) {
        const sourceNode = nodes[Math.floor(Math.random() * nodes.length)];
        let routingTable = [];
        let totalWeight = 0;

        for (let i = 0; i < nodes.length; i++) {
          if (nodes[i] === sourceNode) continue;
          const dx = sourceNode.x - nodes[i].x;
          const dy = sourceNode.y - nodes[i].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const weight = 1 / (dist * dist);
          routingTable.push({ target: nodes[i], weight: weight, dist: dist });
          totalWeight += weight;
        }

        let randomChoice = Math.random() * totalWeight;
        let selectedTarget = routingTable[0].target;
        let selectedDist = routingTable[0].dist;

        for (let i = 0; i < routingTable.length; i++) {
          randomChoice -= routingTable[i].weight;
          if (randomChoice <= 0) {
            selectedTarget = routingTable[i].target;
            selectedDist = routingTable[i].dist;
            break;
          }
        }

        const dynamicSpeed = 1.8 + (selectedDist / 130);
        packets.push({ source: sourceNode, target: selectedTarget, progress: 0, speed: dynamicSpeed, type: 'SYN', color: hexYellow });
      }

      for (let i = packets.length - 1; i >= 0; i--) {
        let p = packets[i];
        p.progress += p.speed / 1000;

        if (p.progress >= 1) {
          if (p.type === 'SYN') {
            packets.push({ source: p.target, target: p.source, progress: 0, speed: p.speed, type: 'SYN-ACK', color: hexRed });
          } else if (p.type === 'SYN-ACK') {
            packets.push({ source: p.target, target: p.source, progress: 0, speed: p.speed, type: 'ACK', color: hexGreen });
          }
          packets.splice(i, 1);
          continue;
        }

        const currX = p.source.x + (p.target.x - p.source.x) * p.progress;
        const currY = p.source.y + (p.target.y - p.source.y) * p.progress;

        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 14;
        ctx.shadowColor = p.color;

        ctx.beginPath();
        ctx.arc(currX, currY, 2.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      nodes.forEach(n => {
        const hexRadius = n.r + 1.1;
        ctx.fillStyle = hexBg;
        ctx.strokeStyle = hexGreen;
        ctx.lineWidth = 1.2;

        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const angle = Math.PI / 3 * i + Math.PI / 6;
          const hx = n.x + hexRadius * Math.cos(angle);
          const hy = n.y + hexRadius * Math.sin(angle);
          if (i === 0) ctx.moveTo(hx, hy);
          else ctx.lineTo(hx, hy);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        n.x += n.vx;
        n.y += n.vy;

        if (n.x < -20) n.x = canvas.width + 20;
        if (n.x > canvas.width + 20) n.x = -20;
        if (n.y < -20) n.y = canvas.height + 20;
        if (n.y > canvas.height + 20) n.y = -20;
      });

      requestAnimationFrame(draw);
    }

    resize();
    initNodes();
    draw();
    window.addEventListener('resize', () => {
      resize();
      initNodes();
    });
  </script>
