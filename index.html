<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V-OS Network Terminal v2.0</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
  <div class="crt-overlay"></div>
  
  <div class="terminal-box">
    <div class="terminal-bar">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="terminal-title">rikkova@core-router-01 ~</span>
    </div>

    <div class="terminal-body" id="terminal-body">
      <div id="terminal">
        <div class="output" id="boot-output"></div>
      </div>
      <div class="input-line" id="input-line" style="display: none;">
        <span class="prompt">guest@rikkova:~$ </span>
        <input type="text" id="cmd" autocomplete="off" spellcheck="false">
      </div>
    </div>
  </div>

  <!-- Topology background SVG -->
  <svg id="topology-bg" xmlns="http://www.w3.org/2000/svg"></svg>

  <script src="app.js"></script>
</body>
</html>
