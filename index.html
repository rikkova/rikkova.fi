<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V-OS Network Terminal v2.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e0f;
      --surface: #111518;
      --border: #1e2d2f;
      --green: #00ff88;
      --yellow: #f0c040;
      --red: #ff4455;
      --text: #c8d8d0;
      --dim: #556677;
      --font-mono: 'Share Tech Mono', monospace;
      --font-display: 'Orbitron', sans-serif;
    }

    /* --- CRT Scanlines & Glow Overlay --- */
    .crt-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.25) 50%
      );
      background-size: 100% 4px;
      z-index: 999;
      pointer-events: none; /* Let clicks pass through to terminal */
      opacity: 0.15;
    }

    /* Add a subtle green glow to the text */
    .terminal-box {
      text-shadow: 0 0 2px rgba(0, 255, 136, 0.4);
    }
    
    /* Screen flicker animation */
    @keyframes flicker {
      0% { opacity: 0.15; }
      50% { opacity: 0.18; }
      100% { opacity: 0.15; }
    }
    .crt-overlay {
      animation: flicker 4s infinite;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    /* Automatically scale everything up by 120% on desktop */
    @media screen and (min-width: 769px) {
      .terminal-box { zoom: 1.2; }
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 15px;
      line-height: 1.7;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      cursor: text;
    }

    /* Animated topology background */
    #topology-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      opacity: 0.18;
      pointer-events: none;
    }

    /* TERMINAL BOX */
    .terminal-box {
      position: relative;
      z-index: 10;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface); /* Now it will follow the theme! */
      backdrop-filter: blur(5px);
      width: 100%;
      max-width: 800px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .terminal-bar {
      background: #1a2226;
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      border-bottom: 1px solid var(--border);
    }

    .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .dot.red { background: var(--red); }
    .dot.yellow { background: var(--yellow); }
    .dot.green { background: var(--green); }

    .terminal-title {
      margin-left: auto;
      font-size: 0.85rem;
      color: var(--dim);
      font-family: var(--font-display);
      letter-spacing: 1px;
    }

    .terminal-body { 
      padding: 1.5rem; 
      max-height: 60vh;
      overflow-y: auto;
    }

    .output { 
      margin-bottom: 15px; 
      white-space: pre-wrap; 
      line-height: 1.5; 
      color: var(--text);
    }
    
    .interactive-node {
      color: var(--yellow);
      cursor: pointer;
      text-decoration: none;
      font-weight: bold;
      transition: all 0.2s ease;
    }
    .interactive-node:hover {
      color: #ffffff;
      text-shadow: 0 0 8px var(--yellow);
      text-decoration: underline;
    }

    .prompt { color: var(--green); font-weight: bold; }
    .user-input { color: var(--yellow); }

    .input-line { display: flex; align-items: center; margin-top: 10px; }
    
    input {
      background: transparent;
      border: none;
      color: var(--yellow);
      font-family: inherit;
      font-size: inherit;
      width: 100%;
      outline: none;
    }
    
    /* Scrollbar styling for terminal body */
    .terminal-body::-webkit-scrollbar { width: 8px; }
    .terminal-body::-webkit-scrollbar-track { background: var(--bg); }
    .terminal-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .terminal-body::-webkit-scrollbar-thumb:hover { background: var(--dim); }

    /* Responsive Design for Mobile Devices */
    @media screen and (max-width: 768px) {
      body {
        padding: 10px;
        font-size: 13px;
      }
      .terminal-box {
        max-width: 100%;
        margin: 0;
        border-radius: 4px;
      }
      .terminal-body {
        max-height: 70vh;
        padding: 1rem;
      }
    }
  </style>
</head>

    function levenshtein(a, b) {
      const matrix = Array.from({ length: b.length + 1 }, (_, i) => [i]);
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i - 1) === a.charAt(j - 1)) {
            matrix[i][j] = matrix[i - 1][j - 1];
          } else {
            matrix[i][j] = Math.min(
              matrix[i - 1][j - 1] + 1,
              matrix[i][j - 1] + 1,
              matrix[i - 1][j] + 1
            );
          }
        }
      }
      return matrix[b.length][a.length];
    }

    function getClosestCommand(input, commandList) {

        if (score < bestScore) {
          bestScore = score;
          bestMatch = command;
        }
      }

      return { bestMatch, bestScore };

    // --- ANIMATED NETWORK BACKGROUND LOGIC ---
    const canvas = document.getElementById('topology-bg');
    const ctx = canvas.getContext('2d');

    let nodes = [];
    let packets = [];
    const NODE_COUNT = 25; 
    const MAX_DIST = 200;  

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function initNodes() {
      nodes = [];
      packets = [];
      for (let i = 0; i < NODE_COUNT; i++) {
        nodes.push({
          id: i,
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.15,
          vy: (Math.random() - 0.5) * 0.15,
          r: Math.random() * 2 + 3,
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // --- DYNAMIC THEME COLORS FOR CANVAS ---
      // Get the current computed colors from the CSS :root variables
      const rootStyles = getComputedStyle(document.documentElement);
      const hexGreen = rootStyles.getPropertyValue('--green').trim() || '#00ff88';
      const hexBg = rootStyles.getPropertyValue('--bg').trim() || '#0a0e0f';
      
      // Helper function to convert Hex to RGB for the alpha transparency calculations
      const hexToRgb = (hex) => {
        let c;
        if(/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)){
            c= hex.substring(1).split('');
            if(c.length== 3){
                c= [c[0], c[0], c[1], c[1], c[2], c[2]];
            }
            c= '0x'+c.join('');
            return [(c>>16)&255, (c>>8)&255, c&255];
        }
        return [0, 255, 136]; // Fallback to default green
      };
      
      const rgbGreen = hexToRgb(hexGreen);

      // 1. Draw Links (Full Mesh, Highly Interlinked)
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const dx = nodes[i].x - nodes[j].x;
          const dy = nodes[i].y - nodes[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          
          let alpha = 0.25 - (dist / (canvas.width * 0.8));
          if (alpha < 0.02) alpha = 0.02;
          
          // Use the dynamic theme color!
          ctx.strokeStyle = `rgba(${rgbGreen[0]}, ${rgbGreen[1]}, ${rgbGreen[2]}, ${alpha})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(nodes[i].x, nodes[i].y);
          ctx.lineTo(nodes[j].x, nodes[j].y);
          ctx.stroke();
        }
      }

      // 2. Generate Network Traffic (Same as before)
      if (Math.random() < 0.015) {
        const sourceNode = nodes[Math.floor(Math.random() * nodes.length)];
        let routingTable = [];
        let totalWeight = 0;
        
        for (let i = 0; i < nodes.length; i++) {
          if (nodes[i] === sourceNode) continue;
          const dx = sourceNode.x - nodes[i].x;
          const dy = sourceNode.y - nodes[i].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const weight = 1 / (dist * dist); 
          routingTable.push({ target: nodes[i], weight: weight, dist: dist });
          totalWeight += weight;
        }

        let randomChoice = Math.random() * totalWeight;
        let selectedTarget = routingTable[0].target;
        let selectedDist = routingTable[0].dist;
        
        for (let i = 0; i < routingTable.length; i++) {
          randomChoice -= routingTable[i].weight;
          if (randomChoice <= 0) {
            selectedTarget = routingTable[i].target;
            selectedDist = routingTable[i].dist;
            break;
          }
        }

        const dynamicSpeed = 2 + (selectedDist / 100);
        
        // Let's also grab the yellow and red variables for the packets!
        const hexYellow = rootStyles.getPropertyValue('--yellow').trim() || '#f0c040';
        packets.push({ source: sourceNode, target: selectedTarget, progress: 0, speed: dynamicSpeed, type: 'SYN', color: hexYellow });
      }

      // 3. Draw and Update Packets (Same as before)
      for (let i = packets.length - 1; i >= 0; i--) {
        let p = packets[i];
        p.progress += p.speed / 1000;

        if (p.progress >= 1) {
          if (p.type === 'SYN') {
            const hexRed = rootStyles.getPropertyValue('--red').trim() || '#ff4455';
            packets.push({ source: p.target, target: p.source, progress: 0, speed: p.speed, type: 'SYN-ACK', color: hexRed });
          } else if (p.type === 'SYN-ACK') {
             packets.push({ source: p.target, target: p.source, progress: 0, speed: p.speed, type: 'ACK', color: hexGreen }); // Final ACK uses main theme color
          }
          packets.splice(i, 1);
          continue;
        }

        const currX = p.source.x + (p.target.x - p.source.x) * p.progress;
        const currY = p.source.y + (p.target.y - p.source.y) * p.progress;

        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 18;
        ctx.shadowColor = p.color;
        
        ctx.beginPath();
        ctx.arc(currX, currY, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      // 4. Draw and Update Nodes (Hexagon Routers)
      nodes.forEach(n => {
        const hexRadius = n.r + 1;
        // Use the dynamic theme background and border colors!
        ctx.fillStyle = hexBg; 
        ctx.strokeStyle = hexGreen;
        ctx.lineWidth = 1.5;
        
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const angle = Math.PI / 3 * i + Math.PI / 6;
          const hx = n.x + hexRadius * Math.cos(angle);
          const hy = n.y + hexRadius * Math.sin(angle);
          if (i === 0) ctx.moveTo(hx, hy);
          else ctx.lineTo(hx, hy);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        n.x += n.vx;
        n.y += n.vy;
        if (n.x < 0) { n.x = canvas.width; n.vx *= -1; }
        if (n.y < 0) { n.y = canvas.height; n.vy *= -1; }
      });

      requestAnimationFrame(draw);
    }

    resize();
    initNodes();
    draw();
    window.addEventListener('resize', () => { resize(); initNodes(); });
