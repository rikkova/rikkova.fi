<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V-OS Network Terminal v2.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e0f;
      --surface: #111518;
      --border: #1e2d2f;
      --green: #00ff88;
      --yellow: #f0c040;
      --red: #ff4455;
      --text: #c8d8d0;
      --dim: #556677;
      --font-mono: 'Share Tech Mono', monospace;
      --font-display: 'Orbitron', sans-serif;
    }

    .retro-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 18%, rgba(0, 255, 136, 0.08), transparent 24%),
        radial-gradient(circle at 82% 28%, rgba(240, 192, 64, 0.06), transparent 20%),
        radial-gradient(circle at 50% 86%, rgba(0, 255, 136, 0.05), transparent 28%),
        linear-gradient(180deg, #0a0e0f 0%, #090c0d 100%);
      opacity: 1;
    }

    .crt-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.22) 50%);
      background-size: 100% 4px;
      z-index: 999;
      pointer-events: none;
      opacity: 0.13;
    }

    .terminal-box {
      text-shadow: 0 0 2px rgba(0, 255, 136, 0.35);
    }

        * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 17px;
      line-height: 1.7;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 18px;
      cursor: text;
    }

    #topology-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      opacity: 0.16;
      pointer-events: none;
    }

    .terminal-box {
      position: relative;
      z-index: 10;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface);
      backdrop-filter: blur(5px);
      width: min(1180px, calc(100vw - 36px));
      min-height: 180px;
      max-height: min(88vh, 920px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
    }

    .terminal-bar {
      background: #1a2226;
      padding: 0.55rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      border-bottom: 1px solid var(--border);
      flex: 0 0 auto;
    }

    .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .dot.red { background: var(--red); }
    .dot.yellow { background: var(--yellow); }
    .dot.green { background: var(--green); }

    .terminal-title {
      margin-left: auto;
      font-size: 0.85rem;
      color: var(--dim);
      font-family: var(--font-display);
      letter-spacing: 1px;
    }

    .terminal-body {
      padding: 1.25rem 1.4rem 0;
      flex: 0 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
    }

    #terminal { padding-bottom: 0.3rem; }

    .output {
      margin-bottom: 15px;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      line-height: 1.5;
      color: var(--text);
    }

    #boot-output {
      white-space: pre-wrap;
      word-break: normal;
      overflow-wrap: break-word;
      line-height: 1.45;
    }

    .interactive-node {
      color: var(--yellow);
      cursor: pointer;
      text-decoration: none;
      font-weight: bold;
      transition: all 0.2s ease;
    }
    .interactive-node:hover {
      color: #ffffff;
      text-shadow: 0 0 8px var(--yellow);
      text-decoration: underline;
    }

    .prompt { color: var(--green); font-weight: bold; }
    .user-input { color: var(--yellow); }

    .input-line {
      position: sticky;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: 0.2rem;
      margin-top: 0.2rem;
      padding: 0.3rem 0 0.42rem;
      background: linear-gradient(rgba(17,21,24,0) 0%, rgba(17,21,24,0.82) 35%, rgba(17,21,24,1) 100%);
      border-top: 1px solid rgba(30,45,47,0.85);
    }

    input {
      background: transparent;
      border: none;
      color: var(--yellow);
      font-family: inherit;
      font-size: inherit;
      width: 100%;
      outline: none;
      caret-color: var(--green);
    }

    .terminal-body::-webkit-scrollbar { width: 8px; }
    .terminal-body::-webkit-scrollbar-track { background: var(--bg); }
    .terminal-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .terminal-body::-webkit-scrollbar-thumb:hover { background: var(--dim); }

    @media screen and (max-width: 768px) {
      body {
        padding: 10px;
        font-size: 14px;
      }
      .terminal-box {
        width: 100%;
        min-height: 160px;
        max-height: calc(100vh - 20px);
        border-radius: 4px;
      }
      .terminal-body {
        padding: 1rem 1rem 0;
      }
      .input-line {
        padding: 0.25rem 0 0.36rem;
      }
      .terminal-title {
        font-size: 0.72rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .crt-overlay { animation: none; }
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body onclick="document.getElementById('cmd').focus()">
  <div class="crt-overlay"></div>
  <div class="terminal-box">
    <div class="terminal-bar">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
      <div class="terminal-title">rikkova@core-router-01 ~</div>

    <div class="terminal-body" id="terminal-body">
      <div id="terminal">
        <div class="output" id="boot-output"></div>
      </div>
      <div class="input-line" id="input-line" style="display: none;">
        <span class="prompt">guest@rikkova:~$ </span>

  <script>
    const terminal = document.getElementById('terminal');

    const cmd = document.getElementById('cmd');

    let isRoot = false;

    let currentPrompt = '<span class="prompt">guest@rikkova:~$ </span>';
    let commandHistory = [];

    let lastJokeIndex = -1;
    let forcedJokeIndex = -1;
    let forcedJokeRepeatsLeft = 0;

    const networkJokes = [
      "Network design is the art of choosing where future problems will happen.",

      "Every packet has a dream. Some just get filtered before they make it.",

      "The maintenance was routine, which is how the interesting incidents always begin.",
      "The final dependency in the migration plan was apparently a handsaw.",
      "Nothing resets the mood on a sev-1 bridge like a client asking whether tonight feels more like wine or beer.",
      "'Losing a few packets' means very different things depending on your profession."
    ];

    const spanningTreeJokeIndex = networkJokes.findIndex(joke => joke === "I would explain spanning tree, but I do not want to create a loop.");

    const incidentDetails = {
      'show incident 1': [
        `<span style="color: var(--red)">INC-2024-09</span>  BGP hierarchy deletion during maintenance`,
        ``,
        `  Impact: An engineer targeted a VRF change but deleted the parent router bgp hierarchy in candidate config`,
        `  Effect: Potential loss of global and VRF-level BGP state if committed unchallenged`,
        `  Root cause: Human error in hierarchical CLI editing with insufficient policy guardrails`,

        `  Prevention: Implemented pre-commit validation to reject destructive parent-level BGP removals`,
        ``,
        `<i style="color: var(--dim)">Summary sanitized for public display.</i>`
      ],
      'show incident 2': [
        `<span style="color: var(--red)">INC-2024-02</span>  Remote access VPN certificate expiry`,
        ``,
        `  Impact: Expired certificate caused remote access VPN authentication failure for active users`,
        `  Effect: Existing sessions dropped and new user connections were rejected until certificate renewal completed`,
        `  Root cause: Certificate renewal was not completed before the service validity window ended`,
        `  Fix: Renewed and deployed the certificate chain, then verified client connectivity and trust state`,

        ``,
        `<i style="color: var(--dim)">Summary sanitized for public display.</i>`
      ],
      'show incident 3': [
        `<span style="color: var(--yellow)">INC-2023-08</span>  Dark fiber path lost during external construction`,
        ``,

        `  Effect: One transport path was lost, but services remained available on the surviving diverse fiber route`,

        ``,
        `<i style="color: var(--dim)">Summary sanitized for public display.</i>`
      ]
    };

    function levenshtein(a, b) {
      const matrix = Array.from({ length: b.length + 1 }, (_, i) => [i]);
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i - 1) === a.charAt(j - 1)) matrix[i][j] = matrix[i - 1][j - 1];
          else matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j] + 1);
        }
      }
      return matrix[b.length][a.length];
    }

    function getClosestCommand(input, commandList) {
      let bestMatch = null;
      let bestScore = Infinity;
      for (const command of commandList) {
        const score = levenshtein(input, command);
        if (score < bestScore) {
          bestScore = score;
          bestMatch = command;
        }
      }
      return { bestMatch, bestScore };
    }

    const dob = new Date(1997, 8, 17);
    const now = new Date();
    let years = now.getFullYear() - dob.getFullYear();
    let months = now.getMonth() - dob.getMonth();
    let days = now.getDate() - dob.getDate();
    if (days < 0) {
      months--;
      days += new Date(now.getFullYear(), now.getMonth(), 0).getDate();
    }
    if (months < 0) {
      years--;
      months += 12;
    }
    const uptimeString = `${years} years, ${months} months, ${days} days`;
    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    async function runBootSequence() {

      const inputLine = document.getElementById('input-line');

      const appendHtml = (html) => {
        bootOutput.innerHTML += html;
        terminalBody.scrollTop = terminalBody.scrollHeight;

      const typeText = async (text, delay = 25) => {
        for (const char of text) {
          if (char === '\n') appendHtml('<br>');
          else appendHtml(char);
          await sleep(delay);

      const currentHour = new Date().getHours();
      const baseIPv4 = 964200;
      const baseIPv6 = 217400;
      const v4Jitter = Math.floor(Math.random() * 450) + (currentHour * 15);
      const v6Jitter = Math.floor(Math.random() * 80) + (currentHour * 5);
      const v4Count = (baseIPv4 + v4Jitter).toLocaleString('en-US');
      const v6Count = (baseIPv6 + v6Jitter).toLocaleString('en-US');

      const rawLogo = `
 __     __      ____  _____ 
 \\ \\   / /     / __ \\/ ____|
  \\ \\_/ /_____| |  | \\___ \\
   \\   /______| |  | |___) |
    \\_/        \\____/_____/ `;

      const logoLines = rawLogo.split('\n');
      for (const line of logoLines) {
        appendHtml(`<span style="color: var(--green);">${line}</span><br>`);
        await sleep(45);
      }

      await sleep(150);
      appendHtml(`V-OS Network Operating System v2.0<br>`);
      await sleep(150);
      appendHtml(`Copyright (c) 1997-${new Date().getFullYear()} Väinö Rikkonen. All rights reserved.<br><br>`);
      await sleep(400);

      const hardwareLogs = [
        'Initializing hardware memory... 16384Mb OK',
        'Checking NVRAM consistency... OK',
        'Mounting flash filesystem... DONE',
        'Loading control plane OS... OK',
        'Initializing crypto engine... [FIPS 140-2 ACTIVE]'
      ];

      for (const log of hardwareLogs) {
        appendHtml(`<span style="color: var(--dim);">[sys]</span> ${log}<br>`);
        await sleep(Math.random() * 80 + 20);
      }

      await sleep(300);
      appendHtml(`<span style="color: var(--dim);">[sys]</span> Loading IPv4 routing table... ${v4Count} prefixes<br>`);
      await sleep(150);
      appendHtml(`<span style="color: var(--dim);">[sys]</span> Loading IPv6 routing table... ${v6Count} prefixes<br>`);
      await sleep(150);
      appendHtml(`<span style="color: var(--dim);">[sys]</span> Bringing up line protocols... UP<br><br>`);
      await sleep(300);

      await typeText('Establishing SSH session');
      for (let i = 0; i < 3; i++) {
        await sleep(350);
        appendHtml('.');
      }
      await sleep(600);
      appendHtml(' <span style="color:var(--green)">[OK]</span><br><br>');
      await typeText('User Access Verification\n\n');
      await sleep(200);
      await typeText('Login: ');
      await sleep(400);
      await typeText('guest\n', 70);
      await sleep(200);
      await typeText('Access: Granted\n');
      await sleep(400);
      appendHtml(`Type '<span style="color:var(--green)">help</span>' to see a list of available commands.<br>`);

      inputLine.style.display = 'flex';
      cmd.focus();
      terminalBody.scrollTop = terminalBody.scrollHeight;
    }

    runBootSequence();

    const commands = {
      'help': `Available commands:\n  whoami            - Display profile information\n  show architecture - View CI/CD automation & TIG observability stack\n  show dwdm         - View active DWDM / 400G DCI transport\n  show version      - View system uptime and certifications\n  show ip route     - View network architecture scope\n  show incidents    - View short incident postmortems\n  show bgp sum      - View IT/Network engineering skills\n  show interface    - View projects\n  show cdp nei      - View languages and soft skills\n  show topology     - View interactive topology\n  ping              - Display contact details\n  traceroute        - Trace career path and job history\n  tcpdump           - Capture live traffic\n  wget resume       - Download my resume (PDF)\n  curl              - Display external IP address information\n  history           - Display command history\n  top               - Monitor active tasks and current focus\n  theme             - Change terminal color (default, amber, cyan, hacker, google, bmw)\n  nmap              - Scan active services and protocols\n  diagnostics       - Run diagnostics\n  joke              - Display a random network/data center joke\n  clear             - Clear the terminal screen`,
      'show bgp sum': `=== Routing, Switching & Optical ===\nProtocols              : BGP, OSPF, IS-IS, MPLS & Segment Routing, VXLAN, BFD\nCisco OS & Hardware    : IOS-XR/XE, NX-OS, NCS, ASR, Nexus, Catalyst, ISE\nMulti-Vendor           : Juniper JunOS, Arista EOS, Nokia SR OS, F5 BIG-IP\nOptical Transport      : DWDM, ADVA, Smartoptics\n\n=== Network Security ===\nFirewalls & NGFW       : Palo Alto, FortiGate, Checkpoint, Cisco ASA\nArchitecture           : SASE, Zero Trust, IPSec/SSL VPN, DDoS Mitigation\n\n=== Automation & Telemetry ===\nNetDevOps              : Python, Ansible, Terraform, Git\nProgrammability        : NETCONF, RESTCONF, gNMI, Cisco NSO/NDFC\nObservability          : SNMP, NetFlow, Telegraf, InfluxDB, Grafana`,
      'show incidents': `<span style="color: var(--yellow)">INCIDENT INDEX</span>\n\n1  <span style="color: var(--red)">INC-2024-09</span>  BGP hierarchy deletion during maintenance\n2  <span style="color: var(--red)">INC-2024-02</span>  Remote access VPN certificate expiry\n3  <span style="color: var(--yellow)">INC-2023-08</span>  Dark fiber path lost during external construction\n\n<i style="color: var(--dim)">Tip: use show incident 1, show incident 2, or show incident 3</i>`,
      'show architecture': `<span style="color: var(--yellow)">=== NEXT-GEN NETWORK AUTOMATION & OBSERVABILITY ARCHITECTURE ===</span>\n\n<span style="color: var(--dim)">[ SOURCE OF TRUTH ]</span>        <span style="color: var(--dim)">[ CI/CD PIPELINE ]</span>              <span style="color: var(--dim)">[ EXECUTION ]</span>\n\n   +------------+         +---------------+           +-------------+\n   |   NetBox   | API     | GitLab CI/CD  | Trigger   |   Ansible   |\n   | (Inventory)|-------->| (Code/Review) |---------->| (Playbooks) |\n   +------------+         +---------------+           +-------------+\n         |                        |                          |\n         |         +--------------v--------------+           | Push Config\n         |         |           Batfish           |           | (API/SSH)\n         +-------->| (Pre-deployment Validation) |           |\n       Inventory   +-----------------------------+           |\n                                                             v\n                                                   +===================+\n                                                   |   CORE NETWORK    |\n                                                   |  (IOS-XR / NXOS)  |\n                                                   +===================+\n                                                      |           |\n<span style="color: var(--dim)">[ TELEMETRY & METRICS ]</span>                     gNMI |           | NetFlow / BMP\n                                                      |           |\n                                         +------------v+    +-----v------+\n                                         |  Telegraf   |    |   pmacct   |\n                                         | (Data Col)  |    |(Flow/BMP)  |\n                                         +------------++    +-----+------+\n                                                      |           |\n                                                      +-----+-----+\n                                                            |\n   +--------------+      +--------------+                   |\n   |   Grafana    |<-----|   InfluxDB   |<------------------+\n   | (Dashboards) |      | (Time-Series)|\n   +--------------+      |      DB)     |\n                         +--------------+\n\n<span style="color: var(--green)">TIG Stack:</span> Telegraf, InfluxDB, Grafana\n\n<span style="color: var(--yellow)">System Overview:</span>\n- <span style="color: var(--green)">Automation:</span> NetBox acts as the source of truth, GitLab pipelines validate intent, Batfish checks changes before deployment, and Ansible pushes the approved configuration.\n- <span style="color: var(--green)">Observability:</span> Telegraf streams telemetry over gNMI, pmacct collects NetFlow and BMP data, InfluxDB stores the time-series data, and Grafana presents it visually.`,
      'show dwdm': `<span style="color: var(--yellow)">=== ACTIVE DWDM / ENCRYPTED 400G DCI ===</span>\n\n             <span style="color: var(--dim)">[ DC1 / WEST ]</span>                         <span style="color: var(--dim)">[ DC2 / WEST ]</span>\n        +----------------------+               +----------------------+\n        |  Smartoptics DWDM 1  |===============|  Smartoptics DWDM 1  |\n        +----------+-----------+    West Fib   +-----------+----------+\n                   |                                       |\n              +----+-----+                           +-----+----+\n              | EDFA/VOA |                           | EDFA/VOA |\n              +----+-----+                           +-----+----+\n                   |                                       |\n   +-------------------------------+       +-------------------------------+\n   | MPLS | VXLAN | EDGE | STORAGE |       | MPLS | VXLAN | EDGE | STORAGE |\n   +-------------------------------+       +-------------------------------+\n                   |                                       |\n              +----+-----+                           +-----+----+\n              | EDFA/VOA |                           | EDFA/VOA |\n              +----+-----+                           +-----+----+\n                   |                                       |\n        +----------+-----------+    East Fib   +-----------+----------+\n        |  Smartoptics DWDM 2  |===============|  Smartoptics DWDM 2  |\n        +----------------------+               +----------------------+\n             <span style="color: var(--dim)">[ DC1 / EAST ]</span>                         <span style="color: var(--dim)">[ DC2 / EAST ]</span>\n\n<span style="color: var(--yellow)">Transport view:</span>\n- <span style="color: var(--green)">Shared services:</span> MPLS routing, VXLAN fabric, Internet edge, and storage replication are presented across both optical paths.\n- <span style="color: var(--green)">West/East paths:</span> Diverse encrypted 400G transport between the two data centers.\n- <span style="color: var(--green)">EDFA / VOA:</span> Optical gain and power balancing on each path.`,
      'show ip route': `Codes: L - local, C - connected, S - static, B - BGP, O - OSPF\n\nGateway of last resort is 0.0.0.0 to network 0.0.0.0\n\nB    0.0.0.0/0 [20/0] via AS24713 (Internet Edge)\n       * Handles CGI external connectivity, peering policy, and edge routing.\nO    10.0.0.0/8 [110/2] via AS1854 (MPLS & Segment Routing Backbone)\n       * Core backbone providing traffic engineering and sub-second failover.\nC    172.16.0.0/12 is directly connected, VXLAN_Fabric\n       * Underlay/Overlay fabric supporting global Data Center hosting.\nS    192.168.0.0/16 [1/0] via Zscaler_SASE\n       * Zero-Trust remote user access (Migrated from legacy VPN).`,
      'show topology': `\n      <span style="color: var(--dim);">[ External Networks ]</span>\n               |\n  +-------------------------+\n  |  <span class="interactive-node" onclick="document.getElementById('cmd').value='show run edge'; const e = new KeyboardEvent('keydown', {key: 'Enter'}); document.getElementById('cmd').dispatchEvent(e);">[ AS24713 ] Internet Edge</span>  |\n  +-------------------------+\n         |           |\n    <span class="interactive-node" onclick="document.getElementById('cmd').value='show run fw1'; const e = new KeyboardEvent('keydown', {key: 'Enter'}); document.getElementById('cmd').dispatchEvent(e);">(FW-01)</span>     <span class="interactive-node" onclick="document.getElementById('cmd').value='show run fw2'; const e = new KeyboardEvent('keydown', {key: 'Enter'}); document.getElementById('cmd').dispatchEvent(e);">(FW-02)</span>\n         |           |\n  +-------------------------+\n  |  <span class="interactive-node" onclick="document.getElementById('cmd').value='show run core'; const e = new KeyboardEvent('keydown', {key: 'Enter'}); document.getElementById('cmd').dispatchEvent(e);">[ AS1854 ] Core MPLS Ring</span>  |\n  +-------------------------+\n         |           |\n  +-------------------------+\n  |  <span class="interactive-node" onclick="document.getElementById('cmd').value='show run fabric'; const e = new KeyboardEvent('keydown', {key: 'Enter'}); document.getElementById('cmd').dispatchEvent(e);">[ VXLAN ] DC Spine/Leaf</span>  |\n  +-------------------------+\n             |\n      <span style="color: var(--dim);">[ CGI Cloud Hosting ]</span>\n\n<i style="color: var(--dim);">Hint: Click on any colored node in the topology to view its configuration.</i>`,

            wgetDiv.innerHTML += `HTTP request sent, awaiting response... 200 OK\nLength: 1048576 (1.0M) [application/pdf]\nSaving to: 'resume_vaino_rikkonen.pdf'\n\n`;
            terminalBody.scrollTop = terminalBody.scrollHeight;
            let progress = 0;
            const progressSpan = document.createElement('span');
            wgetDiv.appendChild(progressSpan);
            const interval = setInterval(() => {
              progress += 20;
              const bar = '='.repeat(progress / 5) + '>'.repeat(progress < 100 ? 1 : 0) + ' '.repeat(20 - (progress / 5));
              progressSpan.innerText = `resume_vaino_rikkonen.pdf    ${progress}%[${bar}]   1.00M  --.-KB/s    in 0.${Math.floor(Math.random()*9)}s`;
              if (progress >= 100) {
                clearInterval(interval);
                const currentD = new Date();
                const timeString = `${currentD.getFullYear()}-${String(currentD.getMonth()+1).padStart(2, '0')}-${String(currentD.getDate()).padStart(2, '0')} ${String(currentD.getHours()).padStart(2, '0')}:${String(currentD.getMinutes()).padStart(2, '0')}`;
                wgetDiv.innerHTML += `\n\n${timeString} (12.4 MB/s) - 'resume_vaino_rikkonen.pdf' saved [1048576/1048576]`;
                const link = document.createElement('a');
                link.href = githubRawUrl;
                link.download = 'resume_vaino_rikkonen.pdf';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                cmd.disabled = false;
                cmd.focus();
              }
            }, 150);
          }, 1200);
          cmd.value = '';
          return;
        }

        if (inputVal === 'soffumaikku') {
          terminal.innerHTML = '';
          cmd.value = '';
          const catDiv = document.createElement('div');
          catDiv.className = 'output';
          catDiv.style.marginTop = '20px';
          terminal.appendChild(catDiv);
          const cats = `<pre style="font-family: var(--font-mono); margin: 15px 0;">\n   /\\_/\\      /\\_/\\\n  ( o.o ) <span style="color: var(--red);">♥</span> ( =^.^= )\n   > ^ <     ( m m )\n</pre>`;
          catDiv.innerHTML = `${currentPrompt}<span class="user-input">soffumaikku</span>\n` + cats + `<i style="color: var(--dim);">Two cute network cats found in the system.</i>\n\n`;
          terminalBody.scrollTop = terminalBody.scrollHeight;
          return;
        }

        if (inputVal === 'whoami') {
          cmd.disabled = true;
          const outputDiv = document.createElement('div');
          outputDiv.className = 'output';
          terminal.appendChild(outputDiv);
          outputDiv.innerHTML = `${currentPrompt}<span class="user-input">whoami</span>\n<span style="color: var(--dim);">Decrypting user profile...</span>\n\n`;
          const targetText = `Name: Väinö Rikkonen\nRole: Infrastructure Architect\nLocation: Vantaa, Finland · AS65001\nStatus: Open to new opportunities — Established\n\nBio: I design and operate core network infrastructure at CGI across three domains: an MPLS/Segment Routing backbone (AS1854), VXLAN-based fabrics supporting CGI's hosting and cloud services, and an Internet edge (AS24713) handling external connectivity, BGP peering, and routing policy.`;
          const textSpan = document.createElement('span');
          outputDiv.appendChild(textSpan);
          const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*';
          let iterations = 0;
          const interval = setInterval(() => {
            textSpan.innerText = targetText.split('').map((letter, index) => {
              if (letter === ' ' || letter === '\n') return letter;
              if (index < iterations) return letter;
              return letters[Math.floor(Math.random() * letters.length)];
            }).join('');
            terminalBody.scrollTop = terminalBody.scrollHeight;
            iterations += 1.5;
            if (iterations >= targetText.length) {
              clearInterval(interval);
              textSpan.innerText = targetText;
              cmd.disabled = false;
              cmd.focus();
            }
          }, 30);
          cmd.value = '';
          return;
        }

        if (inputVal === 'tcpdump' || inputVal.startsWith('tcpdump')) {
          cmd.disabled = true;
          const dumpDiv = document.createElement('div');
          dumpDiv.className = 'output';
          terminal.appendChild(dumpDiv);
          dumpDiv.innerHTML = `${currentPrompt}<span class="user-input">${cmd.value}</span>\n`;
          dumpDiv.innerHTML += `tcpdump: verbose output suppressed, use -v or -vv for full protocol decode\n`;
          dumpDiv.innerHTML += `listening on eth0, link-type EN10MB (Ethernet), capture size 262144 bytes\n\n`;
          const packetsSpan = document.createElement('span');
          dumpDiv.appendChild(packetsSpan);
          let packetCount = 0;
          const maxPackets = Math.floor(Math.random() * 25) + 35;
          const ips = ['192.168.100.45', '10.0.1.1', '10.0.2.1', '8.8.8.8', '1.1.1.1', '172.16.0.5', '140.82.113.3'];
          const generatePacket = () => {
            const src = ips[Math.floor(Math.random() * ips.length)];
            let dst = ips[Math.floor(Math.random() * ips.length)];
            while (dst === src) dst = ips[Math.floor(Math.random() * ips.length)];
            const srcPort = Math.floor(Math.random() * 50000) + 1024;
            const now = new Date();
            const ts = `<span style="color: var(--dim)">${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}.${String(Math.floor(Math.random()*999999)).padStart(6,'0')}</span>`;
            const types = [
              `IP ${src}.${srcPort} > ${dst}.443: Flags [S], seq ${Math.floor(Math.random()*1000000000)}, win 65535, length 0`,
              `IP ${dst}.443 > ${src}.${srcPort}: Flags [S.], seq ${Math.floor(Math.random()*1000000000)}, ack ${Math.floor(Math.random()*1000000000)}, win 65535, length 0`,
              `IP ${src}.${srcPort} > ${dst}.443: Flags [.], ack 1, win 256, length 0`,
              `IP ${src}.179 > ${dst}.${srcPort}: <span style="color: var(--green); font-weight: bold;">BGP</span>, length: 19 (Keepalive Message)`,
              `IP ${dst}.${srcPort} > ${src}.179: <span style="color: var(--green); font-weight: bold;">BGP</span>, length: 65 (Update Message)`,
              `IP ${src}.${srcPort} > ${dst}.443: Flags [P.], seq 1:517, ack 1, win 256, length 516: <span style="color: var(--yellow);">HTTP</span>`,
              `IP ${src} > ${dst}: ICMP echo request, id ${Math.floor(Math.random()*5000)}, seq 1, length 64`,
              `IP ${dst} > ${src}: ICMP echo reply, id ${Math.floor(Math.random()*5000)}, seq 1, length 64`
            ];
            return `${ts} ${types[Math.floor(Math.random() * types.length)]}\n`;
          };
          const interval = setInterval(() => {
            packetsSpan.innerHTML += generatePacket();
            terminalBody.scrollTop = terminalBody.scrollHeight;
            packetCount++;
            if (packetCount >= maxPackets) {
              clearInterval(interval);
              const summarySpan = document.createElement('span');
              summarySpan.innerHTML = `\n${packetCount} packets captured\n${packetCount + Math.floor(Math.random() * 3)} packets received by filter\n0 packets dropped by kernel\n`;
              dumpDiv.appendChild(summarySpan);
              cmd.disabled = false;
              cmd.focus();
            }
          }, 60);
          cmd.value = '';
          return;
        }

        if (inputVal === 'joke') {
          const outputDiv = document.createElement('div');
          outputDiv.className = 'output';
          let jokeIndex;
          if (forcedJokeRepeatsLeft > 0 && forcedJokeIndex !== -1) {
            jokeIndex = forcedJokeIndex;
            forcedJokeRepeatsLeft--;
          } else {
            const availableIndexes = networkJokes.map((_, index) => index).filter(index => index !== lastJokeIndex);
            jokeIndex = availableIndexes[Math.floor(Math.random() * availableIndexes.length)];
            if (jokeIndex === spanningTreeJokeIndex) {
              forcedJokeIndex = jokeIndex;
              forcedJokeRepeatsLeft = 2;
            } else {
              forcedJokeIndex = -1;
              forcedJokeRepeatsLeft = 0;
            }
          }
          lastJokeIndex = jokeIndex;
          outputDiv.innerHTML = `${currentPrompt}<span class="user-input">${cmd.value}</span>\n<span style="color: var(--dim)">[humor]</span> ${networkJokes[jokeIndex]}`;
          terminal.appendChild(outputDiv);
          cmd.value = '';
          terminalBody.scrollTop = terminalBody.scrollHeight;
          return;
        }

        if (inputVal === 'history') {
          const outputDiv = document.createElement('div');
          outputDiv.className = 'output';
          let historyOutput = '';
          if (commandHistory.length > 0) commandHistory.forEach((cmdStr, index) => historyOutput += `<span style="color: var(--dim);">${String(index + 1).padStart(4, ' ')}</span>  ${cmdStr}\n`);
          historyOutput += `<span style="color: var(--dim);">${String(commandHistory.length + 1).padStart(4, ' ')}</span>  history`;
          outputDiv.innerHTML = `${currentPrompt}<span class="user-input">${cmd.value}</span>\n${historyOutput}`;
          terminal.appendChild(outputDiv);
          cmd.value = '';
          terminalBody.scrollTop = terminalBody.scrollHeight;
          return;
        }

        if (inputVal === 'linda') {
          terminal.innerHTML = '';
          cmd.value = '';
          cmd.disabled = true;
          const heartDiv = document.createElement('div');
          heartDiv.style.color = '#E31937';
          heartDiv.style.whiteSpace = 'pre';
          heartDiv.style.textAlign = 'center';
          heartDiv.style.marginTop = '20px';
          heartDiv.style.lineHeight = '1.2';
          terminal.appendChild(heartDiv);
          const heartLines = [
            '   ██████   ██████   ', ' █████████ █████████ ', '█████████████████████', '█████████████████████', ' ███████████████████ ',
            '  █████████████████  ', '    █████████████    ', '      █████████      ', '        █████        ', '          █          '
          ];
          let lineIndex = 0;
          const drawInterval = setInterval(() => {
            if (lineIndex < heartLines.length) {
              heartDiv.innerHTML += heartLines[lineIndex] + '\n';
              terminalBody.scrollTop = terminalBody.scrollHeight;
              lineIndex++;
            } else {
              clearInterval(drawInterval);
              const msg = document.createElement('div');
              msg.className = 'output';
              msg.style.textAlign = 'center';
              msg.style.marginTop = '15px';
              msg.innerHTML = '<i>System status: Deeply in love.</i>';
              terminal.appendChild(msg);
              cmd.disabled = false;
              cmd.focus();
            }
          }, 200);
          return;
        }

        const outputDiv = document.createElement('div');
        outputDiv.className = 'output';
        const promptSpan = currentPrompt;
        const commandSpan = '<span class="user-input">' + (isRoot ? `<span style="color: var(--red);">${cmd.value}</span>` : cmd.value) + '</span>\n';
        let baseCommand = inputVal;
        let grepTerm = null;
        if (inputVal.includes('| grep ')) {
          const parts = inputVal.split('| grep ');
          baseCommand = parts[0].trim();
          grepTerm = parts[1].trim();
        } else if (inputVal.includes('| i ')) {
          const parts = inputVal.split('| i ');
          baseCommand = parts[0].trim();
          grepTerm = parts[1].trim();
        }
        let response = commands[baseCommand];
        if (response && grepTerm) {
          const lines = response.split('\n');
          const matchedLines = lines.filter(line => line.toLowerCase().includes(grepTerm));
          response = matchedLines.length > 0 ? matchedLines.map(line => line.replace(new RegExp(grepTerm, 'gi'), match => `<span style="color: var(--red);">${match}</span>`)).join('\n') : '';
        }
        if (response && response.includes('{{CURRENT_TIME}}')) {
          const d = new Date();
          const helsinkiTime = new Intl.DateTimeFormat('en-GB', {
            timeZone: 'Europe/Helsinki', weekday: 'short', day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', timeZoneName: 'short'
          }).format(d);
          response = response.replace(/{{CURRENT_TIME}}/g, helsinkiTime.replace(/(\d{4}),/, '$1'));
        }
        if (inputVal === '') response = '';
        else if (inputVal === 'sudo' || inputVal.startsWith('sudo ')) response = isRoot ? 'You are already root.' : 'guest is not in the sudoers file. This incident will be reported.';
        else if (!response) {
          const commandList = [...Object.keys(commands), 'joke', 'su', 'su -', 'exit', 'cat /etc/shadow'];
          const { bestMatch, bestScore } = getClosestCommand(inputVal, commandList);
          const normalizedScore = bestMatch ? bestScore / Math.max(inputVal.length, bestMatch.length) : 1;
          const suggestionLine = bestMatch && (bestScore <= 3 || normalizedScore <= 0.35) ? `\nDid you mean: <span style="color: var(--green)">${bestMatch}</span>?` : '';
          response = `% Invalid input detected at '^' marker.\n-bash: ${inputVal}: command not found${suggestionLine}`;
        }
        outputDiv.innerHTML = promptSpan + commandSpan + response;
        terminal.appendChild(outputDiv);
        cmd.value = '';
        terminalBody.scrollTop = terminalBody.scrollHeight;
      }
    });
    const bg = document.querySelector('.retro-bg');

  </script>
</body>
</html>
