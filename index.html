<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Väinö Rikkonen - Network Engineer</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e0f;
      --surface: #111518;
      --border: #1e2d2f;
      --green: #00ff88;
      --yellow: #f0c040;
      --red: #ff4455;
      --text: #c8d8d0;
      --dim: #556677;
      --font-mono: 'Share Tech Mono', monospace;
      --font-display: 'Orbitron', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 18px;
      line-height: 1.7;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      cursor: text;
    }

    /* Animated topology background */
    #topology-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      opacity: 0.18;
      pointer-events: none;
    }

    /* TERMINAL BOX */
    .terminal-box {
      position: relative;
      z-index: 10;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: rgba(17, 21, 24, 0.85); /* Slightly transparent surface */
      backdrop-filter: blur(5px);
      width: 100%;
      max-width: 60vw;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .terminal-bar {
      background: #1a2226;
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      border-bottom: 1px solid var(--border);
    }

    .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .dot.red { background: var(--red); }
    .dot.yellow { background: var(--yellow); }
    .dot.green { background: var(--green); }

    .terminal-title {
      margin-left: auto;
      font-size: 0.85rem;
      color: var(--dim);
      font-family: var(--font-display);
      letter-spacing: 1px;
    }

    .terminal-body { 
      padding: 1.5rem; 
      max-height: 60vh;
      overflow-y: auto;
    }

    .output { 
      margin-bottom: 15px; 
      white-space: pre-wrap; 
      line-height: 1.5; 
      color: var(--text);
    }
    
    .prompt { color: var(--green); font-weight: bold; }
    .user-input { color: var(--yellow); }

    .input-line { display: flex; align-items: center; margin-top: 10px; }
    
    input {
      background: transparent;
      border: none;
      color: var(--yellow);
      font-family: inherit;
      font-size: inherit;
      width: 100%;
      outline: none;
    }
    
    /* Scrollbar styling for terminal body */
    .terminal-body::-webkit-scrollbar { width: 8px; }
    .terminal-body::-webkit-scrollbar-track { background: var(--bg); }
    .terminal-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .terminal-body::-webkit-scrollbar-thumb:hover { background: var(--dim); }

/* Responsive Design for Mobile Devices */
@media screen and (max-width: 768px) {
  body {
    padding: 10px; /* Adds breathing room around the terminal on small screens */
    font-size: 13px; /* Shrinks the text slightly so more words fit per line */
  }

  .terminal-box {
    max-width: 100%; /* Ensures the box doesn't push past the screen width */
    margin: 0;
    border-radius: 4px; /* Slightly sharper corners for mobile */
  }

  .terminal-body {
    max-height: 70vh; /* Takes up a bit more of the mobile screen height */
    padding: 1rem; /* Reduces the inner padding to give text more room */
  }
}
  
  </style>
</head>
<body onclick="document.getElementById('cmd').focus()">
  <!-- Animated Background Canvas -->
  <canvas id="topology-bg"></canvas>

  <div class="terminal-box">
    <div class="terminal-bar">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
      <div class="terminal-title">rikkova@core-router-01 ~</div>
    </div>
    
    <div class="terminal-body" id="terminal-body">
      <div id="terminal">
        <div class="output">Welcome to V-OS Network Terminal v2.0.
Login: guest
Access: Granted
Establishing BGP sessions... <span style="color:var(--green)">[OK]</span>

Type '<span style="color:var(--green)">help</span>' to see a list of available commands.</div>

      <div class="input-line">
        <span class="prompt">guest@rikkova:~$ </span>

  </div>

  <script>
    // --- TERMINAL LOGIC ---
    const terminal = document.getElementById('terminal');

    const cmd = document.getElementById('cmd');

    // Combine data from index-2.html into the command responses
    const commands = {
      'help': 'Available commands:\n  whoami          - Display profile information\n  show ip route   - Show experience/routing table\n  show bgp sum    - View IT/Network engineering skills\n  show interface  - View projects\n  ping            - Display contact details\n  clear           - Clear the terminal screen',
      
      'whoami': 'Name: Väinö Rikkonen\nRole: Infrastucture Architect\nLocation: Helsinki, Finland · AS65001\nStatus: Open to new opportunities — Established\n\nBio: I design and operate core network infrastructure at CGI across three domains: an MPLS/Segment Routing backbone (AS1854), VXLAN-based fabrics supporting CGI\'s hosting and cloud services, and an Internet edge (AS24713) handling external connectivity, BGP peering, and routing policy.',
      
      'show bgp sum': `=== Routing, Switching & Optical ===

Cisco OS & Hardware    : IOS-XR/XE, NX-OS, NCS, ASR, Nexus, Catalyst

      'show ip route': `! == EXPERIENCE ==
router-id 0.0.0.1

!

 role "Network Designer"
 duration "2024 – 2026"
!
 hostname <span style="color: #4285F4; font-weight: bold;">G</span><span style="color: #EA4335; font-weight: bold;">o</span><span style="color: #FBBC05; font-weight: bold;">o</span><span style="color: #4285F4; font-weight: bold;">g</span><span style="color: #34A853; font-weight: bold;">l</span><span style="color: #EA4335; font-weight: bold;">e</span>
 role "Data Center Technician"
 duration "2023 – 2024"
!
 hostname <span style="color: #E31937; font-weight: bold;">CGI</span>
 role "Data Networking Engineer"
 duration "2021 – 2022"
!

 role "Cyber Defense Analyst"
 duration "2020 – 2021"
!

 role "Network Specialist"
 duration "2019 – 2020"
!
 hostname <span style="color: #E31937; font-weight: bold;">CGI</span>

      'show interface': `Interface: Security (ASA to FortiGate Migration)

      'ping': `PING vaino.rikkonen@gmail.com

64 bytes from <a href="https://linkedin.com/in/rikkova" target="_blank" style="color: var(--green); text-decoration: underline;">linkedin.com/in/rikkova</a>: icmp_seq=2 ttl=64 time<1ms

3 packets transmitted, 3 received, 0% packet loss`,    };

    cmd.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const inputVal = cmd.value.trim().toLowerCase();
        
        if (inputVal === 'clear') {
          terminal.innerHTML = '';
          cmd.value = '';
          return;
        }

        const outputDiv = document.createElement('div');
        outputDiv.className = 'output';

        const promptSpan = '<span class="prompt">guest@rikkova:~$ </span>';
        const commandSpan = '<span class="user-input">' + cmd.value + '</span>\n';

        let response = commands[inputVal];
        if (inputVal === '') {
          response = '';
        } else if (!response) {
          response = '% Invalid input detected at \'^\' marker.\n-bash: ' + inputVal + ': command not found';
        }

        outputDiv.innerHTML = promptSpan + commandSpan + response;
        terminal.appendChild(outputDiv);
        
        // Reset input and scroll to bottom of the terminal box
        cmd.value = '';
        terminalBody.scrollTop = terminalBody.scrollHeight;
      }
    });

    // --- ANIMATED NETWORK BACKGROUND LOGIC (from main-3.js) ---
    const canvas = document.getElementById('topology-bg');
    const ctx = canvas.getContext('2d');

    let nodes = [];
    const NODE_COUNT = 30;
    const MAX_DIST = 180;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function initNodes() {
      nodes = [];
      for (let i = 0; i < NODE_COUNT; i++) {
        nodes.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          r: Math.random() * 3 + 2,
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw links (adjacencies)
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const dx = nodes[i].x - nodes[j].x;
          const dy = nodes[i].y - nodes[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < MAX_DIST) {
            const alpha = 1 - dist / MAX_DIST;
            ctx.strokeStyle = `rgba(0, 255, 136, ${alpha * 0.6})`;
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.moveTo(nodes[i].x, nodes[i].y);
            ctx.lineTo(nodes[j].x, nodes[j].y);
            ctx.stroke();
          }
        }
      }

      // Draw nodes (routers)
      nodes.forEach(n => {
        ctx.fillStyle = '#00ff88';
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Move nodes
      nodes.forEach(n => {
        n.x += n.vx;
        n.y += n.vy;
        if (n.x < 0 || n.x > canvas.width) n.vx *= -1;
        if (n.y < 0 || n.y > canvas.height) n.vy *= -1;
      });

      requestAnimationFrame(draw);
    }

    resize();
    initNodes();
    draw();
    window.addEventListener('resize', () => { resize(); initNodes(); });
  </script>
</body>
</html>
