<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V-OS Network Terminal v2.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e0f;
      --surface: #111518;
      --border: #1e2d2f;
      --green: #00ff88;
      --yellow: #f0c040;
      --red: #ff4455;
      --text: #c8d8d0;
      --dim: #556677;
      --font-mono: 'Share Tech Mono', monospace;
      --font-display: 'Orbitron', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    /* Automatically scale everything up by 120% on desktop */
    @media screen and (min-width: 769px) {
      .terminal-box { zoom: 1.2; }
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 15px;
      line-height: 1.7;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      cursor: text;
    }

    /* Animated topology background */
    #topology-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      opacity: 0.18;
      pointer-events: none;
    }

    /* TERMINAL BOX */
    .terminal-box {
      position: relative;
      z-index: 10;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: rgba(17, 21, 24, 0.85); /* Slightly transparent surface */
      backdrop-filter: blur(5px);
      width: 100%;
      max-width: 800px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .terminal-bar {
      background: #1a2226;
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      border-bottom: 1px solid var(--border);
    }

    .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .dot.red { background: var(--red); }
    .dot.yellow { background: var(--yellow); }
    .dot.green { background: var(--green); }

    .terminal-title {
      margin-left: auto;
      font-size: 0.85rem;
      color: var(--dim);
      font-family: var(--font-display);
      letter-spacing: 1px;
    }

    .terminal-body { 
      padding: 1.5rem; 
      max-height: 60vh;
      overflow-y: auto;
    }

    .output { 
      margin-bottom: 15px; 
      white-space: pre-wrap; 
      line-height: 1.5; 
      color: var(--text);
    }
    
    .prompt { color: var(--green); font-weight: bold; }
    .user-input { color: var(--yellow); }

    .input-line { display: flex; align-items: center; margin-top: 10px; }
    
    input {
      background: transparent;
      border: none;
      color: var(--yellow);
      font-family: inherit;
      font-size: inherit;
      width: 100%;
      outline: none;
    }
    
    /* Scrollbar styling for terminal body */
    .terminal-body::-webkit-scrollbar { width: 8px; }
    .terminal-body::-webkit-scrollbar-track { background: var(--bg); }
    .terminal-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .terminal-body::-webkit-scrollbar-thumb:hover { background: var(--dim); }

    /* Responsive Design for Mobile Devices */
    @media screen and (max-width: 768px) {
      body {
        padding: 10px;
        font-size: 13px;
      }
      .terminal-box {
        max-width: 100%;
        margin: 0;
        border-radius: 4px;
      }
      .terminal-body {
        max-height: 70vh;
        padding: 1rem;
      }
    }
  </style>
</head>
<body onclick="document.getElementById('cmd').focus()">
  <!-- Animated Background Canvas -->
  <canvas id="topology-bg"></canvas>

  <div class="terminal-box">
    <div class="terminal-bar">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
      <div class="terminal-title">rikkova@core-router-01 ~</div>
    </div>
    
    <div class="terminal-body" id="terminal-body">
      <div id="terminal">
        <!-- Text will be injected here by JavaScript -->
        <div class="output" id="boot-output"></div>
      </div>
      
      <!-- Added id="input-line" and hidden it by default -->
      <div class="input-line" id="input-line" style="display: none;">
        <span class="prompt">guest@rikkova:~$ </span>
        <input type="text" id="cmd" autocomplete="off" spellcheck="false">
      </div>
    </div>

  <script>
    const terminal = document.getElementById('terminal');
    const terminalBody = document.getElementById('terminal-body');
    const cmd = document.getElementById('cmd');

    // 1. Calculate dynamic system uptime FIRST, before the commands dictionary
    const dob = new Date(1997, 8, 17); // Month 8 is September
    const now = new Date();
    
    let years = now.getFullYear() - dob.getFullYear();
    let months = now.getMonth() - dob.getMonth();
    let days = now.getDate() - dob.getDate();
    
    if (days < 0) {
      months--;
      days += new Date(now.getFullYear(), now.getMonth(), 0).getDate();
    }
    if (months < 0) {
      years--;
      months += 12;
    }
    const uptimeString = `${years} years, ${months} months, ${days} days`;

    // --- BOOT SEQUENCE LOGIC ---
    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    async function runBootSequence() {
      const bootOutput = document.getElementById('boot-output');
      const inputLine = document.getElementById('input-line');
      
      // Helper to simulate typing
      const typeText = async (text, delay = 25) => {
        for (let char of text) {
          bootOutput.innerHTML += char;
          terminalBody.scrollTop = terminalBody.scrollHeight;
          await sleep(delay);
        }
      };

      // 1. Initial greeting
      await typeText("Welcome to V-OS Network Terminal v2.0.\n");
      await sleep(300);
      
      // 2. Login
      await typeText("Login: ");
      await sleep(400);
      await typeText("guest\n", 50); // type "guest" a bit slower
      await sleep(200);
      
      // 3. Access
      await typeText("Access: Granted\n");
      await sleep(500);
      
      // 4. BGP Sessions with blinking dots
      await typeText("Establishing BGP sessions");
      for (let i = 0; i < 3; i++) {
        await sleep(600); // wait before each dot
        bootOutput.innerHTML += ".";
      }
      
      await sleep(800); // suspense pause
      bootOutput.innerHTML += ' <span style="color:var(--green)">[OK]</span>\n\n';
      
      // 5. Help prompt
      await sleep(400);
      bootOutput.innerHTML += "Type '<span style=\"color:var(--green)\">help</span>' to see a list of available commands.";
      
      // 6. Finish boot: Show input line and focus it
      inputLine.style.display = 'flex';
      cmd.focus();
      terminalBody.scrollTop = terminalBody.scrollHeight;
    }

    // Start the boot sequence when page loads
    runBootSequence();
    
    // 2. Define commands dictionary
    const commands = {
      'help': `Available commands:
  whoami          - Display profile information
  show version    - View system uptime and certifications
  show ip route   - View network architecture scope
  show bgp sum    - View IT/Network engineering skills
  show interface  - View projects
  show cdp nei    - View languages and soft skills
  ping            - Display contact details
  traceroute      - Trace career path and job history
  curl            - Display external IP address information
  top             - Monitor active tasks and current focus
  nmap            - Scan active services and protocols
  clear           - Clear the terminal screen`,
      
      'whoami': `Name: Väinö Rikkonen
Role: Infrastructure Architect
Location: Vantaa, Finland · AS65001
Status: Open to new opportunities — Established

Bio: I design and operate core network infrastructure at CGI across three domains: an MPLS/Segment Routing backbone (AS1854), VXLAN-based fabrics supporting CGI's hosting and cloud services, and an Internet edge (AS24713) handling external connectivity, BGP peering, and routing policy.`,
      
      'show bgp sum': `=== Routing, Switching & Optical ===
Protocols              : BGP, OSPF, IS-IS, MPLS & Segment Routing, VXLAN, BFD
Cisco OS & Hardware    : IOS-XR/XE, NX-OS, NCS, ASR, Nexus, Catalyst, ISE
Multi-Vendor           : Juniper JunOS, Arista EOS, Nokia SR OS, F5 BIG-IP
Optical Transport      : DWDM, ADVA, Smartoptics

=== Network Security ===
Firewalls & NGFW       : Palo Alto, FortiGate, Checkpoint, Cisco ASA
Architecture           : SASE, Zero Trust, IPSec/SSL VPN, DDoS Mitigation

=== Automation & Telemetry ===
NetDevOps              : Python, Ansible, Terraform, Git
Programmability        : NETCONF, RESTCONF, gNMI, Cisco NSO/NDFC
Observability          : SNMP, NetFlow, Telegraf, InfluxDB, Grafana`,
      
      'show ip route': `Codes: L - local, C - connected, S - static, B - BGP, O - OSPF

Gateway of last resort is 0.0.0.0 to network 0.0.0.0

B    0.0.0.0/0 [20/0] via AS24713 (Internet Edge)
       * Handles CGI external connectivity, peering policy, and edge routing.
O    10.0.0.0/8 [110/2] via AS1854 (MPLS & Segment Routing Backbone)
       * Core backbone providing traffic engineering and sub-second failover.
C    172.16.0.0/12 is directly connected, VXLAN_Fabric
       * Underlay/Overlay fabric supporting global Data Center hosting.
S    192.168.0.0/16 [1/0] via Zscaler_SASE
       * Zero-Trust remote user access (Migrated from legacy VPN).`,

      'traceroute': `traceroute to career.rikkova.fi (192.168.100.1), 30 hops max, 60 byte packets

 6  Infra-Architect.cgi.com (192.168.100.1)  6.345 ms  6.567 ms  6.890 ms

Trace complete. Next hop: Unknown (Routing dynamically...)`,

      'top': `CPU utilization for five seconds: 85%/15%; one minute: 82%; five minutes: 78%
PID    Runtime(ms)  Invoked   uSecs   5Sec   1Min   5Min TTY Process
 101       3498234     1423    2458  45.2%  42.1%  39.8%   0 Python/Ansible (Automation)
 204       1823942      892    2044  22.5%  25.0%  28.1%   0 BGP Route Reflector Design
 305        923481      431    2142  12.3%  10.5%   9.2%   0 CCNP_SP_Study_Guide.pdf
 409        152341       45    3385   5.0%   4.4%   0.9%   0 Coffee.exe`,

      'curl': `2606:4700:3031::ac43:cd56

Wait, that's Cloudflare.
Are you sitting behind a WAF? Me too ;).`,
      
      'show interface': `Interface: Security (ASA to FortiGate Migration)
 Status: UP (Hardened)
 Description: Migrated EOL Cisco ASAs to Fortinet NGFWs. Executed a complete policy audit and redesign to eliminate technical debt and broad permit-any rules, resulting in a fully hardened, application-aware perimeter.

Interface: Tunnel0 (VPN Re-engineering)

 Description: Re-architected legacy full-tunnel VPN to a split-tunnel model integrated with Zscaler SASE. Eliminated datacenter hairpinning, reducing bandwidth load and improving latency for ~4,000 remote users.

Interface: Optical-Ring (DWDM Metro Expansion)
 Status: UP (High-Capacity)
 Description: Designed and deployed inter-datacenter DWDM capacity across Helsinki using Smartoptics and ADVA. Managed optical power budgets and fiber routing to support growing east-west traffic demands.

Interface: AS24713-Edge (Internet Resilience)
 Status: UP (Sub-second Convergence)
 Description: Re-engineered BGP routing architecture. Implemented BFD and deterministic path selection, achieving sub-second failover and tighter availability SLAs for shared internet services.

Interface: Core-Fabric (DC Migration Program)
 Status: MIGRATED (Zero Impact)
 Description: Lead Network Engineer for a large-scale datacenter migration. Orchestrated the seamless transition of routing, switching, and firewall fabrics while reducing OpEx by decommissioning EOL hardware.`,

      'nmap': `Starting Nmap 7.93 ( https://nmap.org ) at {{CURRENT_TIME}}
Nmap scan report for localhost (127.0.0.1)
Host is up (0.00013s latency).
Not shown: 994 closed tcp ports (reset)

PORT      STATE SERVICE      VERSION

80/tcp    open  http         REST API / Webhook Integration

830/tcp   open  netconf      Infrastructure as Code (IaC)
6653/tcp  open  openflow     SDN & VXLAN Fabric Management

Nmap done: 1 IP address (1 host up) scanned in 0.42 seconds`,
      
      'ping': `Pinging contact.rikkova.fi [2606:4700:3031::ac43:cd56] with 56 bytes of data:
64 bytes from <a href="mailto:vaino.rikkonen@gmail.com" style="color: var(--green); text-decoration: underline;">vaino.rikkonen@gmail.com</a>: icmp_seq=1 ttl=64 time<1ms
64 bytes from <a href="https://linkedin.com/in/rikkova" target="_blank" style="color: var(--green); text-decoration: underline;">linkedin.com/in/rikkova</a>: icmp_seq=2 ttl=64 time<1ms
64 bytes from <a href="https://github.com/rikkova" target="_blank" style="color: var(--green); text-decoration: underline;">github.com/rikkova</a>: icmp_seq=3 ttl=64 time<1ms

--- contact statistics ---
3 packets transmitted, 3 received, 0% packet loss`,
    
      'show cdp nei': `Capability Codes: R - Router, T - Trans Bridge, B - Source Route Bridge
                  S - Switch, H - Host, I - IGMP, r - Repeater, P - Phone

Device ID        Local Intrfce     Holdtme    Capability  Platform  Port ID
Finnish          Eth 0/0           120        H R         Native    Bilingual
English          Eth 0/1           120        H R         Fluent    Professional
Team-Lead        Mgmt 0/0          120        S R         Human     Mentorship
Architecture     Po1               120        S R         Design    Big-Picture
Problem-Solve    Lo0               120        R           Logic     RCA`,  

   
      'show version': `V-OS (tm) Network Operating System Software
Software Version 2026.05
Compiled by Väinö Rikkonen

System uptime is ${uptimeString}
System image file is "flash:vaino-rikkonen-v3.bin"

Active Licenses / Certifications:
 - <span style="color: var(--yellow);">Cisco CCNP Service Provider</span> <span style="color: var(--dim);">[In Progress]</span>`,
    };

    // 3. Listen for commands
    cmd.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const inputVal = cmd.value.trim().toLowerCase();
        
        // --- CLEAR COMMAND ---
        if (inputVal === 'clear') {
          terminal.innerHTML = '';
          cmd.value = '';
          return;
        }
        
        // --- DYNAMIC COMMAND LOGIC ---
        if (inputVal === 'curl' || inputVal.startsWith('curl ')) {
          response = commands['curl ifconfig.me'];
        }
     
        // --- SECRET EASTER EGG (linda) ---
        if (inputVal === 'linda') {
          terminal.innerHTML = '';
          cmd.value = '';
          cmd.disabled = true; 
          
          const heartDiv = document.createElement('div');
          heartDiv.style.color = '#E31937'; 
          heartDiv.style.whiteSpace = 'pre'; 
          heartDiv.style.textAlign = 'center';
          heartDiv.style.marginTop = '20px';
          heartDiv.style.lineHeight = '1.2';
          terminal.appendChild(heartDiv);

          const heartLines = [
            "   ██████   ██████   ",
            " █████████ █████████ ",
            "█████████████████████",
            "█████████████████████",
            " ███████████████████ ",
            "  █████████████████  ",
            "    █████████████    ",
            "      █████████      ",
            "        █████        ",
            "          █          "
          ];

          let lineIndex = 0;
          
          const drawInterval = setInterval(() => {
            if (lineIndex < heartLines.length) {
              heartDiv.innerHTML += heartLines[lineIndex] + '\n';
              terminalBody.scrollTop = terminalBody.scrollHeight;
              lineIndex++;
            } else {
              clearInterval(drawInterval);
              const msg = document.createElement('div');
              msg.className = 'output';
              msg.style.textAlign = 'center';
              msg.style.marginTop = '15px';
              msg.innerHTML = '<i>System status: Deeply in love.</i>';
              terminal.appendChild(msg);
              
              cmd.disabled = false;
              cmd.focus();
              terminalBody.scrollTop = terminalBody.scrollHeight;
            }
          }, 200); 
          
          return;
        }
        
        // --- STANDARD COMMANDS & SUDO LOGIC ---
        const outputDiv = document.createElement('div');
        outputDiv.className = 'output';

        const promptSpan = '<span class="prompt">guest@rikkova:~$ </span>';
        const commandSpan = '<span class="user-input">' + cmd.value + '</span>\n';

        let response = commands[inputVal];

        // Handle the dynamic nmap time (if you added it earlier)
        if (inputVal === 'nmap' && response) {
          const d = new Date();
          const year = d.getFullYear();
          const month = String(d.getMonth() + 1).padStart(2, '0');
          const day = String(d.getDate()).padStart(2, '0');
          const hours = String(d.getHours()).padStart(2, '0');
          const mins = String(d.getMinutes()).padStart(2, '0');
          const tz = d.toLocaleTimeString('en-us', {timeZoneName:'short'}).split(' ')[2] || ''; 
          
          const timeString = `${year}-${month}-${day} ${hours}:${mins} ${tz}`;
          response = response.replace('{{CURRENT_TIME}}', timeString);
        }

        // --- HANDLE SUDO, EMPTY INPUTS, ERRORS ---
        if (inputVal === '') {
          response = '';
        } else if (inputVal === 'sudo' || inputVal.startsWith('sudo ')) {
          response = 'guest is not in the sudoers file. This incident will be reported.';
        } else if (!response) {
          response = `% Invalid input detected at '^' marker.\n-bash: ${inputVal}: command not found`;
        }

        outputDiv.innerHTML = promptSpan + commandSpan + response;
        terminal.appendChild(outputDiv);
        
        cmd.value = '';
        terminalBody.scrollTop = terminalBody.scrollHeight;
      }
    });

    // --- ANIMATED NETWORK BACKGROUND LOGIC ---
    const canvas = document.getElementById('topology-bg');
    const ctx = canvas.getContext('2d');

    let nodes = [];
    const NODE_COUNT = 30;
    const MAX_DIST = 180;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function initNodes() {
      nodes = [];
      for (let i = 0; i < NODE_COUNT; i++) {
        nodes.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          r: Math.random() * 3 + 2,
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const dx = nodes[i].x - nodes[j].x;
          const dy = nodes[i].y - nodes[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < MAX_DIST) {
            const alpha = 1 - dist / MAX_DIST;
            ctx.strokeStyle = `rgba(0, 255, 136, ${alpha * 0.6})`;
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.moveTo(nodes[i].x, nodes[i].y);
            ctx.lineTo(nodes[j].x, nodes[j].y);
            ctx.stroke();
          }
        }
      }

      nodes.forEach(n => {
        ctx.fillStyle = '#00ff88';
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
        ctx.fill();
      });

      nodes.forEach(n => {
        n.x += n.vx;
        n.y += n.vy;
        if (n.x < 0 || n.x > canvas.width) n.vx *= -1;
        if (n.y < 0 || n.y > canvas.height) n.vy *= -1;
      });

      requestAnimationFrame(draw);
    }

    resize();
    initNodes();
    draw();
    window.addEventListener('resize', () => { resize(); initNodes(); });
  </script>
</body>
</html>
