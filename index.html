<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V-OS Network Terminal v2.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e0f;
      --surface: #111518;
      --border: #1e2d2f;
      --green: #00ff88;
      --yellow: #f0c040;
      --red: #ff4455;
      --text: #c8d8d0;
      --dim: #556677;
      --font-mono: 'Share Tech Mono', monospace;
      --font-display: 'Orbitron', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    /* Automatically scale everything up by 120% on desktop */
    @media screen and (min-width: 769px) {
      .terminal-box { zoom: 1.2; }
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 15px;
      line-height: 1.7;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      cursor: text;
    }

    /* Animated topology background */
    #topology-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      opacity: 0.18;
      pointer-events: none;
    }

    /* TERMINAL BOX */
    .terminal-box {
      position: relative;
      z-index: 10;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: rgba(17, 21, 24, 0.85); /* Slightly transparent surface */
      backdrop-filter: blur(5px);
      width: 100%;
      max-width: 800px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .terminal-bar {
      background: #1a2226;
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      border-bottom: 1px solid var(--border);
    }

    .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .dot.red { background: var(--red); }
    .dot.yellow { background: var(--yellow); }
    .dot.green { background: var(--green); }

    .terminal-title {
      margin-left: auto;
      font-size: 0.85rem;
      color: var(--dim);
      font-family: var(--font-display);
      letter-spacing: 1px;
    }

    .terminal-body { 
      padding: 1.5rem; 
      max-height: 60vh;
      overflow-y: auto;
    }

    .output { 
      margin-bottom: 15px; 
      white-space: pre-wrap; 
      line-height: 1.5; 
      color: var(--text);
    }
    
    .prompt { color: var(--green); font-weight: bold; }
    .user-input { color: var(--yellow); }

    .input-line { display: flex; align-items: center; margin-top: 10px; }
    
    input {
      background: transparent;
      border: none;
      color: var(--yellow);
      font-family: inherit;
      font-size: inherit;
      width: 100%;
      outline: none;
    }
    
    /* Scrollbar styling for terminal body */
    .terminal-body::-webkit-scrollbar { width: 8px; }
    .terminal-body::-webkit-scrollbar-track { background: var(--bg); }
    .terminal-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .terminal-body::-webkit-scrollbar-thumb:hover { background: var(--dim); }

    /* Responsive Design for Mobile Devices */
    @media screen and (max-width: 768px) {
      body {
        padding: 10px;
        font-size: 13px;
      }
      .terminal-box {
        max-width: 100%;
        margin: 0;
        border-radius: 4px;
      }
      .terminal-body {
        max-height: 70vh;
        padding: 1rem;
      }
    }
  </style>
</head>
<body onclick="document.getElementById('cmd').focus()">
  <!-- Animated Background Canvas -->
  <canvas id="topology-bg"></canvas>

  <div class="terminal-box">
    <div class="terminal-bar">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
      <div class="terminal-title">rikkova@core-router-01 ~</div>
    </div>
    
    <div class="terminal-body" id="terminal-body">
      <div id="terminal">
        <!-- Text will be injected here by JavaScript -->
        <div class="output" id="boot-output"></div>
      </div>
      
      <!-- Added id="input-line" and hidden it by default -->
      <div class="input-line" id="input-line" style="display: none;">
        <span class="prompt">guest@rikkova:~$ </span>
        <input type="text" id="cmd" autocomplete="off" spellcheck="false">
      </div>
    </div>

  <script>
    const terminal = document.getElementById('terminal');
    const terminalBody = document.getElementById('terminal-body');
    const cmd = document.getElementById('cmd');

    let commandHistory = [];
    let historyIndex = -1;
    
    // 1. Calculate dynamic system uptime FIRST, before the commands dictionary
    const dob = new Date(1997, 8, 17); // Month 8 is September
    const now = new Date();
    
    let years = now.getFullYear() - dob.getFullYear();
    let months = now.getMonth() - dob.getMonth();
    let days = now.getDate() - dob.getDate();
    
    if (days < 0) {
      months--;
      days += new Date(now.getFullYear(), now.getMonth(), 0).getDate();
    }
    if (months < 0) {
      years--;
      months += 12;
    }
    const uptimeString = `${years} years, ${months} months, ${days} days`;

    // --- BOOT SEQUENCE LOGIC ---
    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    async function runBootSequence() {
      const bootOutput = document.getElementById('boot-output');
      const inputLine = document.getElementById('input-line');
      
      // Helper to simulate typing
      const typeText = async (text, delay = 25) => {
        for (let char of text) {
          bootOutput.innerHTML += char;
          terminalBody.scrollTop = terminalBody.scrollHeight;
          await sleep(delay);
        }
      };

      // 1. Initial greeting
      await typeText("Welcome to V-OS Network Terminal v2.0.\n");
      await sleep(300);
      
      // 2. Login
      await typeText("Login: ");
      await sleep(400);
      await typeText("guest\n", 50); // type "guest" a bit slower
      await sleep(200);
      
      // 3. Access
      await typeText("Access: Granted\n");
      await sleep(500);
      
      // 4. BGP Sessions with blinking dots
      await typeText("Establishing BGP sessions");
      for (let i = 0; i < 3; i++) {
        await sleep(600); // wait before each dot
        bootOutput.innerHTML += ".";
      }
      
      await sleep(800); // suspense pause
      bootOutput.innerHTML += ' <span style="color:var(--green)">[OK]</span>\n\n';
      
      // 5. Help prompt
      await sleep(400);
      bootOutput.innerHTML += "Type '<span style=\"color:var(--green)\">help</span>' to see a list of available commands.";
      
      // 6. Finish boot: Show input line and focus it
      inputLine.style.display = 'flex';
      cmd.focus();
      terminalBody.scrollTop = terminalBody.scrollHeight;
    }

    // Start the boot sequence when page loads
    runBootSequence();
    
    // 2. Define commands dictionary
    const commands = {
      'help': `Available commands:
  whoami          - Display profile information
  show version    - View system uptime and certifications
  show ip route   - View network architecture scope
  show bgp sum    - View IT/Network engineering skills
  show interface  - View projects
  show cdp nei    - View languages and soft skills
  ping            - Display contact details
  traceroute      - Trace career path and job history
  curl            - Display external IP address information
  top             - Monitor active tasks and current focus
  nmap            - Scan active services and protocols
  diagnostics     - Run diagnostics

      'show bgp sum': `=== Routing, Switching & Optical ===

Gateway of last resort is 0.0.0.0 to network 0.0.0.0

      'traceroute': `traceroute to career.rikkova.fi (192.168.100.1), 30 hops max, 60 byte packets

      'top': `CPU utilization for five seconds: 85%/15%; one minute: 82%; five minutes: 78%
PID    Runtime(ms)  Invoked   uSecs   5Sec   1Min   5Min TTY Process

      'nmap': `Starting Nmap 7.93 ( https://nmap.org ) at {{CURRENT_TIME}}

      'diagnostics': `Starting system diagnostics...`,
      
      'ping': `Pinging contact.rikkova.fi [2606:4700:3031::ac43:cd56] with 56 bytes of data:

64 bytes from <a href="https://linkedin.com/in/rikkova" target="_blank" style="color: var(--green); text-decoration: underline;">linkedin.com/in/rikkova</a>: icmp_seq=2 ttl=64 time<1ms
64 bytes from <a href="https://github.com/rikkova" target="_blank" style="color: var(--green); text-decoration: underline;">github.com/rikkova</a>: icmp_seq=3 ttl=64 time<1ms

--- contact statistics ---

      'show cdp nei': `Capability Codes: R - Router, T - Trans Bridge, B - Source Route Bridge
                  S - Switch, H - Host, I - IGMP, r - Repeater, P - Phone

      'show version': `V-OS (tm) Network Operating System Software
Software Version 2026.05
Compiled by Väinö Rikkonen

System uptime is ${uptimeString}
System image file is "flash:vaino-rikkonen-v3.bin"

Active Licenses / Certifications:
 - <span style="color: var(--yellow);">Cisco CCNP Service Provider</span> <span style="color: var(--dim);">[In Progress]</span>`,
    };

    // 3. Listen for commands
    cmd.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowUp') {
        e.preventDefault(); // Prevent cursor from jumping to the beginning
        if (historyIndex < commandHistory.length - 1) {
          historyIndex++;
          cmd.value = commandHistory[commandHistory.length - 1 - historyIndex];
        }
        return;
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (historyIndex > 0) {
          historyIndex--;
          cmd.value = commandHistory[commandHistory.length - 1 - historyIndex];
        } else if (historyIndex === 0) {
          historyIndex = -1;
          cmd.value = '';
        }
        return;
      }

      // --- TAB COMPLETION LOGIC ---
      if (e.key === 'Tab') {
        e.preventDefault(); // Prevent focus shifting to another HTML element
        const inputVal = cmd.value.toLowerCase();
        
        // Get all available commands (from your dictionary + special ones like clear/sudo)
        const allCommands = Object.keys(commands).concat(['clear', 'sudo']);
        
        // Find matching commands
        const matches = allCommands.filter(c => c.startsWith(inputVal));
        
        if (matches.length === 1) {
          // If exactly one match, autocomplete it!
          cmd.value = matches[0];
        } else if (matches.length > 1) {
          // If multiple matches, show them to the user (like real bash)
          const outputDiv = document.createElement('div');
          outputDiv.className = 'output';
          outputDiv.innerHTML = `<span class="prompt">guest@rikkova:~$ </span><span class="user-input">${cmd.value}</span>\n${matches.join('  ')}`;
          terminal.appendChild(outputDiv);
          terminalBody.scrollTop = terminalBody.scrollHeight;
        }
        return;
      }

            // --- CTRL+C (SIGINT) LOGIC ---
      if (e.ctrlKey && e.key === 'c') {
        e.preventDefault();
        
        const outputDiv = document.createElement('div');
        outputDiv.className = 'output';
        // Print the prompt, whatever they were typing, and the ^C symbol
        outputDiv.innerHTML = `<span class="prompt">guest@rikkova:~$ </span><span class="user-input">${cmd.value}</span>^C`;
        terminal.appendChild(outputDiv);
        
        cmd.value = ''; // Clear input
        historyIndex = -1;
        terminalBody.scrollTop = terminalBody.scrollHeight;
        return;
      }
      
      if (e.key === 'Enter') {
        const inputVal = cmd.value.trim().toLowerCase();
        
        // Push command to history (only if it's not empty and not the same as the last one)
        if (inputVal !== '' && commandHistory[commandHistory.length - 1] !== inputVal) {
          commandHistory.push(inputVal);
        }
        historyIndex = -1; // Reset index on enter

        // --- CLEAR COMMAND ---
        if (inputVal === 'clear') {
          terminal.innerHTML = '';
          cmd.value = '';
          return;
        }
        

        if (inputVal === 'diagnostics') {
          cmd.disabled = true; // prevent typing while loading
          
          let progress = 0;
          const diagDiv = document.createElement('div');
          diagDiv.className = 'output';
          terminal.appendChild(diagDiv);

          const interval = setInterval(() => {
            progress += 5;
            const bar = '█'.repeat(progress / 5) + '░'.repeat(20 - (progress / 5));
            diagDiv.innerHTML = `<span class="prompt">guest@rikkova:~$ </span><span class="user-input">diagnostics</span>\nRunning system diagnostics...\n[${bar}] ${progress}%`;
            
            if (progress >= 100) {
              clearInterval(interval);
              diagDiv.innerHTML += '\n\nCPU: OK\nRAM: OK\nRouting Table: OPTIMAL\nCandidate Status: HIRE IMMEDIATELY';
              cmd.disabled = false;
              cmd.focus();
              terminalBody.scrollTop = terminalBody.scrollHeight;
            }
          }, 100);
          
          cmd.value = '';
          return; // Skip normal output processing
        }
        
        // --- SECRET EASTER EGG (linda) ---
        if (inputVal === 'linda') {
          terminal.innerHTML = '';
          cmd.value = '';
          cmd.disabled = true; 
          
          const heartDiv = document.createElement('div');
          heartDiv.style.color = '#E31937'; 
          heartDiv.style.whiteSpace = 'pre'; 
          heartDiv.style.textAlign = 'center';
          heartDiv.style.marginTop = '20px';
          heartDiv.style.lineHeight = '1.2';
          terminal.appendChild(heartDiv);

          const heartLines = [
            "   ██████   ██████   ",
            " █████████ █████████ ",
            "█████████████████████",
            "█████████████████████",
            " ███████████████████ ",
            "  █████████████████  ",
            "    █████████████    ",
            "      █████████      ",
            "        █████        ",
            "          █          "
          ];

          let lineIndex = 0;
          
          const drawInterval = setInterval(() => {
            if (lineIndex < heartLines.length) {
              heartDiv.innerHTML += heartLines[lineIndex] + '\n';
              terminalBody.scrollTop = terminalBody.scrollHeight;
              lineIndex++;
            } else {
              clearInterval(drawInterval);
              const msg = document.createElement('div');
              msg.className = 'output';
              msg.style.textAlign = 'center';
              msg.style.marginTop = '15px';
              msg.innerHTML = '<i>System status: Deeply in love.</i>';
              terminal.appendChild(msg);
              
              cmd.disabled = false;
              cmd.focus();
              terminalBody.scrollTop = terminalBody.scrollHeight;
            }
          }, 200); 
          
          return;
        }
        
        // --- STANDARD COMMANDS & SUDO LOGIC ---
        const outputDiv = document.createElement('div');
        outputDiv.className = 'output';

        const promptSpan = '<span class="prompt">guest@rikkova:~$ </span>';
        const commandSpan = '<span class="user-input">' + cmd.value + '</span>\n';

        let baseCommand = inputVal;
        let grepTerm = null;

        // Check for Linux pipe '| grep' or Cisco pipe '| i' or '| include'
        if (inputVal.includes('| grep ')) {
          const parts = inputVal.split('| grep ');
          baseCommand = parts[0].trim();
          grepTerm = parts[1].trim();
        } else if (inputVal.includes('| i ')) {
          const parts = inputVal.split('| i ');
          baseCommand = parts[0].trim();
          grepTerm = parts[1].trim();
        }

        let response = commands[baseCommand];

        // --- GREP FILTERING LOGIC ---
        if (response && grepTerm) {
          // Split response into lines, and only keep lines that match the grep term
          const lines = response.split('\n');
          const matchedLines = lines.filter(line => line.toLowerCase().includes(grepTerm));
          
          if (matchedLines.length > 0) {
            // Highlight the searched term in red
            const regex = new RegExp(grepTerm, 'gi');
            response = matchedLines.map(line => 
              line.replace(regex, match => `<span style="color: var(--red);">${match}</span>`)
            ).join('\n');
          } else {
            response = ''; // Return nothing if no match, just like real grep
          }
        }

        // --- GLOBAL PLACEHOLDER REPLACEMENTS ---
        if (response && response.includes('{{CURRENT_TIME}}')) {
          const d = new Date();
          
          // Format specific to Helsinki to get the correct EET/EEST abbreviation
          const helsinkiTime = new Intl.DateTimeFormat('en-GB', {
            timeZone: 'Europe/Helsinki',
            weekday: 'short',
            day: '2-digit',
            month: 'short',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            timeZoneName: 'short'
          }).format(d);
          
          // The format returns: "Sat, 16 May 2026, 14:45:00 EEST"
          // We remove the comma after the year to make it cleaner (e.g. for HTTP headers)
          const formattedTime = helsinkiTime.replace(/(\d{4}),/, '$1');
          
          // Use regex /{{CURRENT_TIME}}/g to replace ALL instances in the string, not just the first one
          response = response.replace(/{{CURRENT_TIME}}/g, formattedTime);
        }

        // --- HANDLE SUDO, EMPTY INPUTS, ERRORS ---
        if (inputVal === '') {
          response = '';
        } else if (inputVal === 'sudo' || inputVal.startsWith('sudo ')) {
          response = 'guest is not in the sudoers file. This incident will be reported.';
        } else if (!response) {
          response = `% Invalid input detected at '^' marker.\n-bash: ${inputVal}: command not found`;
        }

        outputDiv.innerHTML = promptSpan + commandSpan + response;
        terminal.appendChild(outputDiv);
        
        cmd.value = '';
        terminalBody.scrollTop = terminalBody.scrollHeight;
      }
    });

    // --- ANIMATED NETWORK BACKGROUND LOGIC ---
    const canvas = document.getElementById('topology-bg');
    const ctx = canvas.getContext('2d');

    let nodes = [];
    let packets = [];
    const NODE_COUNT = 25; // Number of routers/switches
    const MAX_DIST = 200;  // Maximum link distance

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function initNodes() {
      nodes = [];
      packets = [];
      for (let i = 0; i < NODE_COUNT; i++) {
        nodes.push({
          id: i,
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.15, // Extremely slow movement
          vy: (Math.random() - 0.5) * 0.15,
          r: Math.random() * 2 + 3, // Slightly larger nodes
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Draw Links (Full Mesh / Highly Interlinked)
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const dx = nodes[i].x - nodes[j].x;
          const dy = nodes[i].y - nodes[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          
          // The further away, the more transparent the link. 
          // This simulates thick local fabrics and faint long-haul WAN links.
          // Max canvas width is roughly the max distance.
          let alpha = 0.25 - (dist / (canvas.width * 0.8)); 
          if (alpha < 0.02) alpha = 0.02; // Ensure even longest links are barely visible

          ctx.strokeStyle = `rgba(0, 255, 136, ${alpha})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(nodes[i].x, nodes[i].y);
          ctx.lineTo(nodes[j].x, nodes[j].y);
          ctx.stroke();
        }
      }

      // 2. Generate Network Traffic (Initiate TCP Handshake with SYN)
      if (Math.random() < 0.015) { 
        // Pick a random Source node
        const sourceNode = nodes[Math.floor(Math.random() * nodes.length)];
        
        // Calculate distances to all OTHER nodes to simulate a routing table
        let routingTable = [];
        let totalWeight = 0;
        
        for (let i = 0; i < nodes.length; i++) {
          if (nodes[i] === sourceNode) continue;
          
          const dx = sourceNode.x - nodes[i].x;
          const dy = sourceNode.y - nodes[i].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          
          // Weight calculation: Inverse of distance squared.
          // This makes short links astronomically preferred (like OSPF cost),
          // but long-haul links still have a tiny fraction of a chance to be used.
          const weight = 1 / (dist * dist); 
          routingTable.push({ target: nodes[i], weight: weight, dist: dist });
          totalWeight += weight;
        }

        // Weighted random selection (The "Routing Decision")
        let randomChoice = Math.random() * totalWeight;
        let selectedTarget = routingTable[0].target;
        let selectedDist = routingTable[0].dist;
        
        for (let i = 0; i < routingTable.length; i++) {
          randomChoice -= routingTable[i].weight;
          if (randomChoice <= 0) {
            selectedTarget = routingTable[i].target;
            selectedDist = routingTable[i].dist;
            break;
          }
        }
        
        // Speed is based on distance so long-haul packets don't take 5 minutes to arrive
        // but short packets don't instantly teleport.
        const dynamicSpeed = 2 / selectedDist; 

        packets.push({
          source: sourceNode,
          target: selectedTarget,
          progress: 0,
          speed: dynamicSpeed,
          type: 'SYN',
          color: '#f0c040' // SYN (Yellow)
        });
      }

      // 3. Draw and Update Packets (Stateful TCP Handshake)
      for (let i = packets.length - 1; i >= 0; i--) {
        let p = packets[i];
        p.progress += p.speed;
        
        // Handshake state machine
        if (p.progress >= 1) {
          if (p.type === 'SYN') {
            packets.push({
              source: p.target, target: p.source,
              progress: 0, speed: p.speed,
              type: 'SYN-ACK', color: '#ff4455'
            });
          } else if (p.type === 'SYN-ACK') {
            packets.push({
              source: p.target, target: p.source,
              progress: 0, speed: p.speed,
              type: 'ACK', color: '#00ff88'
            });
          }
          packets.splice(i, 1);
          continue;
        }

        const currX = p.source.x + (p.target.x - p.source.x) * p.progress;
        const currY = p.source.y + (p.target.y - p.source.y) * p.progress;

        ctx.fillStyle = '#ffffff'; 
        ctx.shadowBlur = 18;
        ctx.shadowColor = p.color; 
        ctx.beginPath();
        ctx.arc(currX, currY, 3, 0, Math.PI * 2); 
        ctx.fill();
        ctx.shadowBlur = 0; 
      }

      // 4. Draw and Update Nodes (Hexagon Routers)
      nodes.forEach(n => {
        const hexRadius = n.r + 1; 
        ctx.fillStyle = '#0a0e0f'; 
        ctx.strokeStyle = '#00ff88'; 
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const angle = (Math.PI / 3) * i + (Math.PI / 6); 
          const hx = n.x + hexRadius * Math.cos(angle);
          const hy = n.y + hexRadius * Math.sin(angle);
          if (i === 0) ctx.moveTo(hx, hy);
          else ctx.lineTo(hx, hy);
        }
        ctx.closePath(); 
        ctx.fill();
        ctx.stroke();

        n.x += n.vx;
        n.y += n.vy;
        if (n.x < 0 || n.x > canvas.width) n.vx *= -1;
        if (n.y < 0 || n.y > canvas.height) n.vy *= -1;
      });

      requestAnimationFrame(draw);
    }

    resize();
    initNodes();
    draw();
    window.addEventListener('resize', () => { resize(); initNodes(); });
  </script>
</body>
</html>
